# nextest's settings for the workspace (#506, loop three of the speed line).
#
# The long tests start first. nextest runs the suite as one queue on the
# runner's threads; in the binaries' own order the 5 to 15 s tests
# started late and the run ended on them alone. A higher priority starts
# earlier (nextest's `priority`, -100 to 100, default 0); within a tier the
# order is nextest's own. The tiers are by the seconds the Test job's log
# (PR 521's run 41629365902) and a 4-thread local run gave each test at
# #506's tip; a test whose wait is the behaviour it tests (a busy ceiling,
# a deadline, a stress loop) keeps its wait and starts first instead.
# Re-tier from the next timings.
#
# The Test job's threads (#527, loop four): the `ci` profile, which the Test
# job's run selects (`--profile ci` in .github/workflows/ci.yml), runs eight
# tests at once on the runner's four cores. The long tests wait rather than
# compute (the callback's 8 s deadline, json_refusal's busy run on a
# binary, the toolbox's 5 s writer acquire, the recoveries' polls), and at
# one thread a core the four threads idled through those waits while the
# short tests queued behind them. The default profile keeps nextest's one
# thread a core, so a local run is unchanged. The `ci` profile inherits
# the default's settings, and the default's overrides (the tiers above)
# apply under it too.
[profile.ci]
test-threads = 8

# 8 s and more.
[[profile.default.overrides]]
filter = """
test(=spend_gate::tests::create_action_beside_a_monitor_shaped_writer_answers_no_store_error)
| test(=server::arc_callback_tests::arc_callback_deadline_served_default_is_eight_seconds)
| binary_id(bsv-wallet-cli::json_refusal)
| binary_id(bsv-wallet-cli::gate_vectors)
| binary_id(bsv-wallet-cli::served_beef_doors)
| (binary_id(bsv-wallet-cli::wire) & test(/^(wire|a_recording_is_not_a_replay|.*_under_the_knob|two_message_only_differences_report_two_markers)$/))
"""
priority = 100

# 3 to 8 s.
[[profile.default.overrides]]
filter = """
test(=store::tests::only_the_writers_acquire_timeout_is_busy)
| test(/^server::arc_callback_tests::arc_callback_(under_a_busy_store|busy_store_under|writer_not_acquired|deadline_)/)
| binary_id(bsv-wallet-cli::arcade_webhook_vector_tests)
| binary_id(bsv-wallet-cli::wire_consumers)
| test(=commands::daemon_tenant::tests::relay_router_retries_busy_items_in_order_and_deletes_acked_rows)
"""
priority = 50

# 1 to 3 s.
[[profile.default.overrides]]
filter = """
test(/^commands::cleanup_abandoned::tests::/)
| test(/^broadcast_reconcile::tests::a_seen_but_absent/)
| binary_id(bsv-wallet-cli::wire)
| binary_id(bsv-wallet-cli::origins_cli)
"""
priority = 20
