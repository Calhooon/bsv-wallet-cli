name: Nightly

# The oracle's night shift (#75, #76; docs/NIGHTLY.md): the five fuzz targets
# of fuzz/ for an hour each on the corpus checked in, and cargo-mutants over
# the hot paths with a floor per file. Its own file: ci.yml is the PR gate and
# this is not. Every action is pinned by commit sha.
#
# A mutation floor is a measured floor that only rises: a file's floor is the
# score a night measured, rounded down, and it is raised in the same commit as
# the tests that earn the raise, never by an edit alone (docs/NIGHTLY.md).
# tools/scoreboard --check --base lets a floor fall only when the base
# carries no measurement for its file (no docs/scoreboard/mutants.json at the
# base, or no entry for the file in it) and the tree's record carries one, and
# then only to that score rounded down; a floor never rises above it, and a
# floor with a measurement at the base may never fall.
#
# GitHub registers workflow_dispatch from the default branch (main), so a copy
# of this file lives on main; a dispatch (`gh workflow run nightly.yml --ref
# beta`) runs the ref it names, and every job checks out that ref's commit at
# the dispatch, `github.sha`, never the ref (#423): run 41340299977, dispatched
# on beta 6bf9a2c, checked the ref out per job while beta moved and ran its
# fifty shards on nine later commits under three target lists. Each shard's
# artifact names the commit it ran on, and the score refuses a night of more
# than one tree.
# The owner's word (2026-10-27): no schedule. The measurement runs on dispatch
# (`gh workflow run nightly.yml --ref beta`), before each minor tag as RELEASING
# names it and on demand; a scheduled night cost about twenty-five runner-hours,
# starved the pull requests' checks and read in the afternoon.
#
# Two modes (#462, the owner's word through the keeper of 2026-11-02: "even
# the nightly... is all that necessary? or maybe a fraction"). INCREMENTAL,
# the default, mutates only the floored files whose figure may have moved
# since the last complete run (the job `plan`, .github/nightly/changed_set.py)
# and carries every other file's figure from that run with its run and sha;
# its fuzz targets run FUZZ_SECONDS_INCREMENTAL each and the bench runs only
# when `bench` is set. COMPLETE mutates every floored file in
# MUTANTS_SHARDS_COMPLETE shards (twenty, #460, six at a time in four waves, #513), fuzzes each
# target an hour and runs the bench: the night of record,
# dispatched at each pin (docs/RELEASING.md), and the only night that may move
# a floor. `gh workflow run nightly.yml --ref beta` is an incremental night;
# `-f mode=complete` the complete one; `-f bench=true` the week's bench.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental (the changed floored files; the rest carried from the last complete run) or complete (every floored file; at each pin)'
        type: choice
        options: [incremental, complete]
        default: incremental
      bench:
        description: 'run the bench job (the captain sets it once a week; a complete night runs it regardless)'
        type: boolean
        default: false

permissions:
  contents: read

# One night at a time (#144), and a complete night in four waves (#460, #513). The
# earliest dispatched night (run 40074725488) started its twenty shards and five
# fuzz targets at once, took every runner the account has for over an hour
# and starved every PR check, so the matrix ran six at a time; at fifty
# shards (#310) a complete night then took ten hours (run 41340299977) and
# 8h12m (run 41413946663). A complete night now runs at the fleet's 17:30Z
# slot (#456, #514, docs/NIGHTLY.md: the keeper's read of the runner pool
# put 16Z to 18Z among its lightest hours and 03:00Z in a busy one), as
# twenty shards, the account's concurrent-job limit, six at a
# time in four waves of 6, 6, 6 and 2 (the plan's max-parallel,
# HEAVY_RUN_PARALLEL, #513: the account's twenty runners are one pool across
# four repositories, which the opening API read of 11-03 found at twenty at its
# peak in 22 of 24 hours, a job beside a heavy run waiting a median 0:38 and
# a worst 88:53 against 0:02 and 3:16 beside none, and the non-heavy p95 at
# 14 slots; every heavy run caps at six until a read shows that p95 under
# 10). The stage after the matrix runs under the same cap (#517): the fuzz
# targets wait for the matrix (needs: mutants) so that no shard waits for
# them, then run three at once beside the hermetic shards three at a time (the
# plan's FUZZ_PARALLEL and HERMETIC_PARALLEL, three plus three, the captain's
# call on run 41516017523's figures: about two hours; the plan refuses
# figures whose sum passes the cap), and the reach job and the bench wait for
# both and run last, two jobs. Before #517 the hermetic six, the five
# targets, reach and bench could run together, thirteen jobs at once. An
# incremental night keeps six at a time (#144): its shards, then the same
# stage. The group is one name, never one per
# ref: the schedule runs from main and a dispatch from the ref it names, so a
# group of nightly-${{ github.ref }} would let a dispatched night on beta and
# the scheduled one run side by side. A night started while one runs waits
# for it (cancel-in-progress: false, so a night is never cut short); GitHub
# keeps one waiting run per group and cancels an older waiting one.
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2
  # The fuzz jobs' rustc, a dated nightly (#395): the unpinned channel took
  # rustc 1.101.0-nightly of 2026-10-31 (f9ceb4a4d), which refuses sqlx-core
  # 0.8.6 with E0391 (a cycle computing whether `error::Error` needs async
  # drop), so no target built. nightly-2026-10-30 (rustc 92b5b8c87 of
  # 2026-10-29) built and ran all five. The pin moves by PR when a newer
  # nightly is proven to build and run the five targets, never by drift.
  FUZZ_NIGHTLY: nightly-2026-10-30
  CARGO_MUTANTS_VERSION: 27.1.0
  # A complete night's shards (#460): the account's concurrent-job limit,
  # six at a time in four waves (the plan's HEAVY_RUN_PARALLEL, #513);
  # 923 mutants, 46 or 47 a shard. The
  # count is this limit, never a figure a night's worst shard raises: a shard
  # past the job's limit (timeout-minutes below) is a refusal of the night,
  # with the shard named by the score (docs/NIGHTLY.md).
  MUTANTS_SHARDS_COMPLETE: 20
  # An incremental night's ceiling (#462, its own sizing): the plan deals its
  # changed files' mutants at most 19 a shard (the complete night's of the
  # record then, 923 in fifty), in at least six shards (#144's six at once)
  # while there are six mutants, a whole set in this many.
  MUTANTS_SHARDS_INCREMENTAL: 50
  # The fuzz budget per target (#462): an hour on a complete night; on an
  # incremental night ten minutes, from the execution rates of run 41413946663
  # (docs/scoreboard/fuzz.json, an hour each): allow_pending 41,463 a second,
  # served_json 32,571, beef_reader 3,494, brc29_remittance 592,
  # explorer_bodies 3.45, so ten minutes is 2,070 cases of the slowest target
  # (its 18 seeds and the hour's 379 additions, each replayed several times
  # over) and 355,000 of brc29_remittance's.
  FUZZ_SECONDS_COMPLETE: 3600
  FUZZ_SECONDS_INCREMENTAL: 600
  # The hermetic pass's shards (#393; docs/NIGHTLY.md: the count from the
  # suite's measured time and the cargo pass's survivors) and its
  # cargo-mutants: the upstream commit that makes -F select struct-field
  # deletion mutants too (sourcefrog/cargo-mutants #632, fixed by #634 after
  # 27.1.0, unreleased); 27.1.0 adds every such mutant to every selection.
  # Its --list of the five files equals 27.1.0's name for name and in order
  # (1,191 at 6bf9a2c; 923, each once, since #400), and each shard checks its
  # selection against the survivors, refusing a name listed twice.
  MUTANTS_HERMETIC_SHARDS: 6
  CARGO_MUTANTS_HERMETIC_REV: b00aff0c6ca0670bccdf4eb2ece9e15c4c35c8b9
  # The left-out targets' reach job's coverage tool (#401), the version its
  # record .github/nightly/no-floored-reach.json was measured with.
  CARGO_LLVM_COV_VERSION: 0.6.14

jobs:
  # The night's plan (#462): which floored files tonight mutates, in how many
  # shards, under which cargo test selection. A complete night: every floored
  # file in MUTANTS_SHARDS_COMPLETE shards, six at a time (#513). An incremental night: the floored files
  # changed since the last complete run (docs/scoreboard/mutants.json names
  # it), every floored file a changed test reaches (by the reach record of
  # #401; a target it does not measure reaches all of them), and the whole set
  # when Cargo.lock, a workspace manifest or this workflow changed; an empty
  # set plans no shard and the night carries every figure, saying so. The
  # plan's table goes to the run's summary and plan.json to the artifact
  # nightly-plan, which the score reads.
  plan:
    name: The night's plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      files: ${{ steps.plan.outputs.files }}
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
      parallel: ${{ steps.plan.outputs.parallel }}
      fuzz_parallel: ${{ steps.plan.outputs.fuzz_parallel }}
      hermetic_parallel: ${{ steps.plan.outputs.hermetic_parallel }}
      empty: ${{ steps.plan.outputs.empty }}
      selection: ${{ steps.plan.outputs.selection }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The dispatch's commit, never the ref (#423), with the history the
          # diff against the last complete run's commit needs.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the night
        id: plan
        env:
          MODE: ${{ inputs.mode || 'incremental' }}
        run: |
          python3 -B .github/nightly/changed_set.py --mode "$MODE" \
            --complete-shards "$MUTANTS_SHARDS_COMPLETE" --max-shards "$MUTANTS_SHARDS_INCREMENTAL" \
            --out plan.json --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-plan
          path: plan.json
          if-no-files-found: error
          retention-days: 30

  # After the Mutants matrix (#460), whatever it concluded, so that a complete
  # night's twenty shards (six at a time, four waves, #513) run alone; a night without a plan
  # fuzzes nothing. The plan's fuzz_parallel at once (#517: three, the cap less
  # the hermetic shards' three beside them), so the five run in two rounds.
  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: [plan, mutants]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.fuzz_parallel) }}
      matrix:
        target: [beef_reader, brc29_remittance, served_json, explorer_bodies, allow_pending]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The dispatch's commit, never the ref (#423): a job that starts
          # hours into the night still checks out the tree the night was
          # dispatched on, whatever the ref has moved to since.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.FUZZ_NIGHTLY }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
          key: fuzz

      - name: Install cargo-fuzz
        run: cargo +"$FUZZ_NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      # The night's budget on the checked-in corpus: FUZZ_SECONDS_COMPLETE (an
      # hour) on a complete night, FUZZ_SECONDS_INCREMENTAL (ten minutes)
      # otherwise. New entries land in new/, crashes
      # in crashes/; the step records the exit and whether libFuzzer wrote
      # an input (a crash, a timeout, out of memory) and never fails, so the
      # corpus and the crash are uploaded before the job's verdict. A
      # non-zero exit with no input (the target did not build, cargo-fuzz
      # failed) is not a crash: the job fails and no issue is opened.
      - name: Fuzz for the night's budget
        id: fuzz
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ inputs.mode == 'complete' && env.FUZZ_SECONDS_COMPLETE || env.FUZZ_SECONDS_INCREMENTAL }}
        run: |
          mkdir -p "new/$TARGET" "crashes/$TARGET"
          set +e
          cargo +"$FUZZ_NIGHTLY" fuzz run "$TARGET" "new/$TARGET" "fuzz/corpus/$TARGET" -- \
            -max_total_time="$FUZZ_SECONDS" -timeout=60 -print_final_stats=1 \
            -artifact_prefix="crashes/$TARGET/" 2>&1 | tee fuzz.log
          status=${PIPESTATUS[0]}
          echo "exit=$status" >> "$GITHUB_OUTPUT"
          # libFuzzer's stopping inputs; a slow-unit-* it may also write is
          # not one, and the run went on past it.
          inputs=$(find "crashes/$TARGET" -type f \( -name 'crash-*' -o -name 'timeout-*' \
            -o -name 'oom-*' -o -name 'leak-*' \) -print -quit)
          if [ "$status" != "0" ] && [ -n "$inputs" ]; then
            echo "crashed=true" >> "$GITHUB_OUTPUT"
          else
            echo "crashed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # The entries that add coverage beyond the checked-in corpus, by
      # libFuzzer's merge: the run's corpus growth, for a PR to commit.
      - name: Keep the corpus entries that add coverage
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p merged additions
          cp "fuzz/corpus/$TARGET"/* merged/
          cargo +"$FUZZ_NIGHTLY" fuzz run "$TARGET" merged "new/$TARGET" -- -merge=1 2>&1 | tail -5
          for f in merged/*; do
            [ -e "fuzz/corpus/$TARGET/$(basename "$f")" ] || cp "$f" additions/
          done
          echo "corpus additions: $(find additions -type f | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"

      # A PR from this workflow is refused by the repository's setting
      # (Actions may not create pull requests), so the additions are an
      # artifact; docs/NIGHTLY.md says how they are committed.
      - name: Upload the corpus additions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-${{ matrix.target }}
          path: additions/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the crash inputs
        if: always() && steps.fuzz.outputs.crashed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-${{ matrix.target }}
          path: |
            crashes/${{ matrix.target }}/
            fuzz.log
          retention-days: 90

      # A crash is an issue with the input attached: each input base64 in
      # the body (an issue takes no file), the panic's tail, the run. One
      # open issue per target; a later crash comments on it.
      - name: Open or update the crash issue
        if: always() && steps.fuzz.outputs.crashed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly fuzz: $TARGET crashed"
          {
            echo "The nightly fuzz target \`$TARGET\` stopped with exit ${{ steps.fuzz.outputs.exit }} ($RUN, artifact \`crash-$TARGET\`)."
            echo
            echo "Reproduce: save an input below (\`base64 -d\`) and run \`cargo +$FUZZ_NIGHTLY fuzz run $TARGET <file>\` from the checkout's root."
            for f in crashes/"$TARGET"/*; do
              [ -f "$f" ] || continue
              echo
              size=$(wc -c < "$f" | tr -d ' ')
              if [ "$size" -gt 16384 ]; then
                echo "**$(basename "$f")** ($size bytes; the first 16 KB, base64; the whole input is in the artifact):"
              else
                echo "**$(basename "$f")** ($size bytes, base64):"
              fi
              echo '```'
              head -c 16384 "$f" | base64 -w 76
              echo '```'
            done
            echo
            echo "The log's tail:"
            echo '```'
            tail -n 40 fuzz.log
            echo '```'
          } > body.md
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          fi

      - name: The verdict
        if: always()
        env:
          EXIT: ${{ steps.fuzz.outputs.exit }}
          CRASHED: ${{ steps.fuzz.outputs.crashed }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$CRASHED" = "true" ]; then
            echo "::error::$TARGET crashed (exit $EXIT)"
            exit 1
          elif [ "$EXIT" != "0" ]; then
            echo "::error::$TARGET did not run (exit $EXIT, no crash input: the build or cargo-fuzz failed; see the fuzz step's log)"
            exit 1
          fi

  # cargo-mutants over the hot paths, a complete night in twenty shards (923
  # mutants, 46 or 47 a shard, #460; one mutant is a build and the oracle's
  # tests below). Each mutant
  # is listed once (#400): cargo-mutants walks the modules of each crate from
  # its root with no record of the files it has visited, so a file both
  # main.rs and lib.rs declared was listed twice under one name (1,224 at
  # edd3ea0, 301 of them repeats: broadcast_verify.rs, explorers.rs and
  # server/handlers.rs); the binary now takes those modules from the library.
  # Copy mode (never --in-place); a mutant's tests stop at twice the shard's
  # own baseline, a timeout, scored as not caught. Dealt round-robin (#310):
  # the missed mutants lie in runs of the list (one tracker_host stretch), so
  # a consecutive slice gathers them into one shard.
  #
  # The count is the account's concurrent-job limit (#460), never one a
  # night's worst shard raises: run 41413946663's own per-mutant times
  # (fifty shards, 44.3 runner-hours, a baseline of 619 s on average and 685
  # s at most) dealt round-robin into twenty give a shard of 103 to 141
  # minutes, under the job's 340. A shard past the limit is cut, writes no
  # success marker, and the score refuses the night naming it.
  #
  # The shards, the files, the selection and the max-parallel are the plan's
  # (#462): a complete night's twenty over the five files, six at a time in four waves (#513), an
  # incremental night's few over its changed files alone, six at a time; no
  # shard when the plan is empty.
  mutants:
    name: Mutants (shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.shards != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      # The plan's: a complete night's twenty at the 17:30Z slot (#460, #514),
      # six at a time in four waves, the fleet's heavy-run cap (#513); an
      # incremental night's six at a time, leaving runners for the PR checks
      # (#144).
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix:
        # 0 to the plan's shards - 1; the score job counts the same.
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The dispatch's commit, never the ref (#423): a job that starts
          # hours into the night still checks out the tree the night was
          # dispatched on, whatever the ref has moved to since.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked

      # The oracle (#310; the owner's word of 2026-11-01: the selection is
      # never the oracle's ceiling): every test target of the package that
      # runs a line of a floored file, whole, with nothing skipped inside a
      # target: the library's and the binaries' unit tests and every tests/
      # target, a target added later joining by itself. The targets named in
      # .github/nightly/no-floored-targets (the one list, #401: this step and
      # the guard both read it) are left out, each because it runs no line
      # of the five files under coverage and starts no process (cargo
      # llvm-cov per target, the job mutants-reach and docs/NIGHTLY.md): the
      # architecture scanners and
      # rule 28's sites read the source as text, the BRC-100 oracle reads the
      # committed fixtures, header_source and signing_digest_vector call
      # other modules, so a mutant can change their verdict only by its text,
      # never by the behaviour the score judges. serve_bind_guard also reads
      # no line, but its served case kills the binary it starts and a killed
      # process leaves no coverage, so it stays. The package has no doctest.
      # The benches run too, each routine once in criterion's test mode with
      # its assertions, a bench added later joining by itself: gate_assess and
      # create_action_signed run lines of spend_gate.rs and tracker_host.rs;
      # internalize_action (server/post_word.rs alone) and list_outputs run
      # no line of the five, so the list leaves them out too. The five fuzz
      # targets' properties
      # join as tests/fuzz_replay.rs, which replays each target's committed
      # seeds through the function its fuzz_target! calls, on stable (#396,
      # docs/NIGHTLY.md).
      #
      # The limit: the whole oracle's baseline took more than 300 s on every
      # shard of run 41253247135, so no fixed --timeout; the baseline always
      # runs (never --baseline skip: a skipped baseline lets a broken tree
      # read as every mutant caught), unbounded but by the job's limit, and
      # each mutant's tests stop at twice the shard's measured baseline
      # (--timeout-multiplier 2; cargo-mutants prints the figure as "Auto-set
      # test timeout"). The shard prints its selection before it runs.
      #
      # The exit code (cargo-mutants 27.1.0): 0 every mutant caught, 2 a
      # mutant missed, 3 a test timed out; the score job judges those, so the
      # shard goes on. 4 is the unmutated baseline failing, so no mutant was
      # tested, and 1 a usage error: the shard fails, never green with an
      # empty outcomes.json. Any other code fails it too.
      # The selection is the plan's (.github/nightly/changed_set.py): --lib
      # --bins, a --test for every target under tests/ and a --bench for
      # every bench, less the left-out list's entries.
      - name: Mutate the hot paths
        env:
          SHARDS: ${{ needs.plan.outputs.shards }}
          FILES: ${{ needs.plan.outputs.files }}
          SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          selection="$SELECTION"
          files=()
          for f in $FILES; do files+=(-f "$f"); done
          echo "shard ${{ matrix.shard }}/$SHARDS over ${FILES}: cargo test --locked $selection"
          echo "left out (no line of a floored file): $(python3 -B .github/nightly/no_floored.py list test) $(python3 -B .github/nightly/no_floored.py list bench)"
          status=0
          # $selection is split into its words on purpose.
          # shellcheck disable=SC2086
          cargo mutants "${files[@]}" \
            --shard "${{ matrix.shard }}/$SHARDS" --sharding round-robin \
            --baseline run --timeout-multiplier 2 \
            --build-timeout 900 --test-workspace false --output out \
            -- --locked $selection || status=$?
          case "$status" in
            0|2|3)
              echo "cargo-mutants exit $status: mutants tested; the score job judges"
              echo "shard ${{ matrix.shard }}/$SHARDS exit $status; cargo test --locked $selection" > out/mutants.out/shard-ok ;;
            4) echo "::error::cargo-mutants exit 4: the unmutated baseline failed, no mutant was tested"; exit 1 ;;
            1) echo "::error::cargo-mutants exit 1: a usage error, no mutant was tested"; exit 1 ;;
            *) echo "::error::cargo-mutants exit $status: no outcome to judge"; exit 1 ;;
          esac

      # The commit the shard ran on, beside its outcomes (#423); after
      # cargo-mutants, which moves an existing mutants.out aside.
      - name: Name the shard's commit
        if: always()
        run: mkdir -p out/mutants.out && git rev-parse HEAD | tee out/mutants.out/sha

      # The per-mutant logs beside the outcomes (#510): cargo-mutants writes
      # one log a mutant (its build and its cargo test output, the failing
      # tests by name) and baseline.log, so a night's record can say which
      # tests killed each caught mutant, and a later PR's rule-15 evidence is
      # selected from the night by name, never re-measured blind. The score
      # and the survivors' job read outcomes.json, sha and shard-ok alone.
      - name: Upload the outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-${{ matrix.shard }}
          path: |
            out/mutants.out/outcomes.json
            out/mutants.out/sha
            out/mutants.out/missed.txt
            out/mutants.out/diff/
            out/mutants.out/log/
            out/mutants.out/shard-ok
          retention-days: 30

  # The left-out targets' reach (#401): the guard on the Mutants shards'
  # exclusion. Every entry of .github/nightly/no-floored-targets (the list
  # the selection above reads) runs under cargo llvm-cov, one run a target,
  # on the night's tree; .github/nightly/no_floored.py fails the job naming
  # each entry that runs a line of a floored file (the files of
  # MUTANTS_FLOORS) and that line, since such a target judges a floored file
  # and belongs in the oracle. One runner, after the shards (#460: the opening
  # wave is theirs alone, as for the fuzz targets), and after the fuzz
  # targets and the hermetic shards, whatever they concluded (#517: the stage
  # under the cap, so reach and bench run last, two jobs): 674 s
  # of measurement and a 199 s cold build on the Studio Mac at load 34, where
  # re-measuring in each of twenty shards would cost twenty times that. The
  # score refuses a night whose reach job did not succeed. The artifact
  # no-floored-reach is the night's record; the captain commits it over
  # .github/nightly/no-floored-reach.json when the list or the floored files
  # change, and CI's ratchet job checks that record against the list.
  mutants-reach:
    name: Mutants left-out reach
    needs: [plan, mutants, fuzz, mutants-hermetic]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The dispatch's commit, never the ref (#423).
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants-reach

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked

      - name: Measure each left-out target's reach of the floored files
        run: |
          mkdir -p out
          python3 -B .github/nightly/no_floored.py measure out/no-floored-reach.json

      - name: Upload the night's record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: no-floored-reach
          path: out/no-floored-reach.json
          if-no-files-found: ignore
          retention-days: 30

  # The cargo pass's survivors (#393): every mutant whose outcome was missed
  # or timeout, by name, once; a caught mutant is caught and an unviable one
  # never built, so neither is judged again. Only after every cargo shard of
  # the plan's matrix succeeded (needs: a failed or cancelled shard skips this job, and
  # the markers are checked as the score job checks them).
  #
  # The hermetic pass's shards (#462): a complete night keeps
  # MUTANTS_HERMETIC_SHARDS; an incremental night deals its survivors twenty
  # a shard, at most MUTANTS_HERMETIC_SHARDS; no survivor, no hermetic shard.
  mutants-survivors:
    name: Mutants survivors
    needs: [plan, mutants]
    runs-on: ubuntu-latest
    outputs:
      hermetic_shards: ${{ steps.collect.outputs.hermetic_shards }}
      hermetic_matrix: ${{ steps.collect.outputs.hermetic_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The dispatch's commit, never the ref (#423): a job that starts
          # hours into the night still checks out the tree the night was
          # dispatched on, whatever the ref has moved to since.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutants-*
          path: outcomes

      - name: Collect the survivors of the cargo pass
        id: collect
        env:
          SHARDS: ${{ needs.plan.outputs.shards }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          missing=""
          for shard in $(seq 0 $((SHARDS - 1))); do
            [ -f "outcomes/mutants-$shard/shard-ok" ] || missing="$missing $shard"
          done
          if [ -n "$missing" ]; then
            echo "::error::cargo shards without a success marker:$missing; no survivors are collected from a partial pass"
            exit 1
          fi
          python3 .github/nightly/mutants_hermetic.py survivors outcomes survivors.txt | tee -a "$GITHUB_STEP_SUMMARY"
          # The commit the survivors were collected on, for the score (#423).
          mkdir -p survivors
          mv survivors.txt survivors/
          git rev-parse HEAD > survivors/sha
          n=$(grep -c . survivors/survivors.txt || true)
          if [ "$n" -eq 0 ]; then
            h=0
          elif [ "$MODE" = complete ]; then
            h=$MUTANTS_HERMETIC_SHARDS
          else
            h=$(( (n + 19) / 20 ))
            [ "$h" -le "$MUTANTS_HERMETIC_SHARDS" ] || h=$MUTANTS_HERMETIC_SHARDS
          fi
          echo "hermetic_shards=$h" >> "$GITHUB_OUTPUT"
          echo "hermetic_matrix=$(python3 -c "import json; print(json.dumps(list(range($h))))")" >> "$GITHUB_OUTPUT"
          echo "$n survivors, $h hermetic shard(s) ($MODE night)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-survivors
          path: |
            survivors/survivors.txt
            survivors/sha
          if-no-files-found: error
          retention-days: 30

  # The hermetic pass (#393): tests/e2e_hermetic.rs, the hermetic e2e suite
  # as a cargo test target, judges only the cargo pass's survivors, dealt
  # round-robin over MUTANTS_HERMETIC_SHARDS shards; the score is the union.
  # It starts after the cargo matrix ends, three shards at a time (the plan's
  # hermetic_parallel, #517) beside three fuzz targets: six jobs, the
  # fleet's cap; the reach job and the bench wait for it. Each shard: the e2e-hermetic job's setup (Node
  # 24, npm ci, Playwright's Chromium with its system libraries), the MCP
  # binary built once (the mcp package is not mutated), the unmutated suite
  # once as a stability check (a flaky scene would read as a caught mutant,
  # so an unstable suite refuses the shard), then cargo-mutants with -F
  # selecting exactly the shard's survivors, checked by --list before it runs, over
  # `cargo test --locked --test e2e_hermetic` with E2E_HERMETIC_ORACLE=1;
  # its own baseline is the second unmutated run. The suite runs to its end
  # whether or not a scenario failed, so a mutant costs a build and a whole
  # suite (or the timeout, twice the baseline). The copy cargo-mutants makes
  # leaves gitignored node_modules and the browsers out, so NODE_PATH and
  # PLAYWRIGHT_BROWSERS_PATH name the checkout's. An environment fault the
  # test meets (a held port, a binary not this build's) prints
  # E2E_HERMETIC_UNJUDGED and would read as caught, so any mutant's log
  # carrying the word refuses the shard.
  mutants-hermetic:
    name: Mutants-hermetic (shard ${{ matrix.shard }})
    needs: [plan, mutants-survivors]
    if: needs.mutants-survivors.outputs.hermetic_shards != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NODE_USE_ENV_PROXY: '1'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.hermetic_parallel) }}
      matrix:
        # 0 to the survivors job's hermetic_shards - 1; the score job counts the same.
        shard: ${{ fromJSON(needs.mutants-survivors.outputs.hermetic_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The dispatch's commit, never the ref (#423): a job that starts
          # hours into the night still checks out the tree the night was
          # dispatched on, whatever the ref has moved to since.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants-hermetic

      - name: Install cargo-mutants (the -F fix, pinned by commit)
        run: |
          cargo install --git https://github.com/sourcefrog/cargo-mutants \
            --rev "$CARGO_MUTANTS_HERMETIC_REV" --locked cargo-mutants

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Install the harness's dependency (Playwright)
        working-directory: tests/e2e
        run: npm ci

      - name: Cache Playwright's Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cca/pw-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cca/pw-browsers
        run: node tests/e2e/install-browsers.js --with-deps

      - name: Build the MCP binary the suite's scenario 21 drives
        run: cargo build --release --locked -p bsv-wallet-mcp

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cargo-survivors

      - name: Judge the shard's survivors by the hermetic suite
        env:
          SHARD: ${{ matrix.shard }}
          HSHARDS: ${{ needs.mutants-survivors.outputs.hermetic_shards }}
          FILES: ${{ needs.plan.outputs.files }}
          E2E_HERMETIC_ORACLE: '1'
          E2E_WALLET_TMP: ${{ runner.temp }}/e2e
          BSV_WALLET_MCP_BIN: ${{ github.workspace }}/target/release/bsv-wallet-mcp
          NODE_PATH: ${{ github.workspace }}/tests/e2e/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cca/pw-browsers
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: |
          mkdir -p "$E2E_WALLET_TMP" out/mutants.out
          python3 .github/nightly/mutants_hermetic.py shard survivors.txt "$SHARD" \
            "$HSHARDS" shard.names shard.re
          cp shard.names out/mutants.out/
          if [ ! -s shard.names ]; then
            echo "hermetic shard $SHARD/$HSHARDS: no survivor dealt here"
            echo "hermetic shard $SHARD/$HSHARDS: no survivor" > out/mutants.out/shard-ok
            exit 0
          fi
          echo "the stability check: the unmutated suite once, before cargo-mutants' baseline"
          if ! cargo test --locked --test e2e_hermetic; then
            echo "::error::the unmutated hermetic suite failed: an unstable suite would read as caught mutants, so the shard judges nothing"
            exit 1
          fi
          # The plan's files: the cargo pass mutated these alone (#462).
          files=()
          for f in $FILES; do files+=(-f "$f"); done
          select=()
          while IFS= read -r rx; do select+=(-F "$rx"); done < shard.re
          # The listing colour-free (#435): cargo-mutants reads the
          # workflow's CARGO_TERM_COLOR=always and coloured the names the
          # check compares; NO_COLOR overrides any colour forcing.
          NO_COLOR=1 cargo mutants --list --colors never "${files[@]}" "${select[@]}" > shard.listed
          python3 .github/nightly/mutants_hermetic.py check-list shard.names shard.listed
          status=0
          cargo mutants "${files[@]}" "${select[@]}" \
            --baseline run --timeout-multiplier 2 --jobs 1 \
            --build-timeout 900 --test-workspace false --output out \
            -- --locked --test e2e_hermetic || status=$?
          if grep -rl E2E_HERMETIC_UNJUDGED out/mutants.out/log/; then
            echo "::error::a run above met an environment fault (E2E_HERMETIC_UNJUDGED), which cargo-mutants reads as caught: the shard is not judged"
            exit 1
          fi
          case "$status" in
            0|2|3)
              echo "cargo-mutants exit $status: the survivors judged; the score job takes the union"
              echo "hermetic shard $SHARD/$HSHARDS exit $status; cargo test --locked --test e2e_hermetic (serve without a tracker pass, the classic ARC stub, the explorers walled)" > out/mutants.out/shard-ok ;;
            4) echo "::error::cargo-mutants exit 4: the unmutated baseline failed, no mutant was tested"; exit 1 ;;
            1) echo "::error::cargo-mutants exit 1: a usage error, no mutant was tested"; exit 1 ;;
            *) echo "::error::cargo-mutants exit $status: no outcome to judge"; exit 1 ;;
          esac

      - name: Name the shard's commit
        if: always()
        run: mkdir -p out/mutants.out && git rev-parse HEAD | tee out/mutants.out/sha

      - name: Upload the outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermetic-mutants-${{ matrix.shard }}
          path: |
            out/mutants.out/outcomes.json
            out/mutants.out/sha
            out/mutants.out/missed.txt
            out/mutants.out/shard.names
            out/mutants.out/diff/
            out/mutants.out/log/
            out/mutants.out/shard-ok
          retention-days: 30

  mutants-score:
    name: Mutation score
    needs: [plan, mutants, mutants-survivors, mutants-hermetic, mutants-reach]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The dispatch's commit, never the ref (#423): a job that starts
          # hours into the night still checks out the tree the night was
          # dispatched on, whatever the ref has moved to since.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutants-*
          path: outcomes

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hermetic-mutants-*
          path: hermetic

      # A night is judged whole or not at all (#310). A shard cut at the
      # job's 340 minutes (the limit's rule, #460: the count does not grow;
      # the night is refused with the shard named), failed or cancelled
      # still uploads what it has (the upload runs under always(), for the
      # evidence), and a partial
      # outcomes.json would be scored as if it were the file's night. So
      # the score refuses unless the matrix concluded success and every
      # shard uploaded the marker its step writes only after cargo-mutants
      # ended with 0, 2 or 3; the refusal names each shard without one, the
      # night is red by design and nothing is scored.
      # The hermetic pass is half of the night (#393): its survivors' job and
      # every one of its shards must have succeeded and left its marker too.
      # And the left-out targets' reach job (#401): a night whose excluded
      # targets were not measured at zero reach ran an oracle that may lack a
      # judge.
      # The counts are the plan's (#462): its cargo shards and the survivors
      # job's hermetic shards. The cargo pass's count is mutants_score.py
      # --shards-only's (#460): each shard of the dispatched matrix (the plan's
      # `matrix`, never a number written here) must have its artifact and its
      # marker, and the refusal names each that has not and each artifact
      # outside the matrix. An empty plan ran no shard and is scored as a
      # night that carries every figure; a night with no survivor runs no
      # hermetic shard and needs none.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.result == 'success'
        with:
          name: nightly-plan
          path: plan

      - name: Refuse a night with a shard that did not succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          EMPTY: ${{ needs.plan.outputs.empty }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          HSHARDS: ${{ needs.mutants-survivors.outputs.hermetic_shards }}
          SHARDS_RESULT: ${{ needs.mutants.result }}
          SURVIVORS_RESULT: ${{ needs.mutants-survivors.result }}
          HERMETIC_RESULT: ${{ needs.mutants-hermetic.result }}
          REACH_RESULT: ${{ needs.mutants-reach.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::the night's plan concluded $PLAN_RESULT; a night without a plan is never scored"
            exit 1
          fi
          if [ "$REACH_RESULT" != "success" ]; then
            echo "::error::the left-out targets' reach job concluded $REACH_RESULT; a night whose left-out targets are not measured at zero reach is never scored"
            exit 1
          fi
          if [ "$EMPTY" = "true" ]; then
            echo "the plan is empty: no floored file changed since the last complete run and no test or dependency reaches one; no shard ran and the night carries every figure" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! python3 -B .github/nightly/mutants_score.py --shards-only --plan plan/plan.json outcomes; then
            echo "::error::the Mutants shards concluded $SHARDS_RESULT and the dispatched matrix of $SHARDS shards is not whole (the score names each shard above); a partial night is never scored"
            exit 1
          fi
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::the Mutants shards concluded $SHARDS_RESULT though every shard left its marker; a partial night is never scored"
            exit 1
          fi
          echo "all $SHARDS Mutants shards succeeded"
          if [ "$SURVIVORS_RESULT" = "success" ] && [ "$HSHARDS" = "0" ]; then
            echo "no survivor of the cargo pass: the hermetic pass has nothing to judge"
            echo "- the cargo pass: \`$(cut -d';' -f2- outcomes/mutants-0/shard-ok | sed 's/^ //')\`; no survivor, no hermetic pass" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          missing=""
          for shard in $(seq 0 $((HSHARDS - 1))); do
            [ -f "hermetic/hermetic-mutants-$shard/shard-ok" ] || missing="$missing $shard"
          done
          if [ "$SURVIVORS_RESULT" != "success" ] || [ "$HERMETIC_RESULT" != "success" ] || [ -n "$missing" ]; then
            echo "::error::the survivors' job concluded $SURVIVORS_RESULT and the Mutants-hermetic shards $HERMETIC_RESULT; hermetic shards without a success marker:${missing:- none}; a night without its hermetic pass is never scored"
            exit 1
          fi
          echo "all $HSHARDS Mutants-hermetic shards succeeded; the score judges the night"
          {
            echo "## The targets the night ran under"
            echo
            echo "- the cargo pass: \`$(cut -d';' -f2- outcomes/mutants-0/shard-ok | sed 's/^ //')\`"
            echo "- the hermetic pass, on the cargo pass's survivors: \`$(cut -d';' -f2- hermetic/hermetic-mutants-0/shard-ok | sed 's/^ //')\`, cargo-mutants at $CARGO_MUTANTS_HERMETIC_REV"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The survivors' commit, after the refusal above (a failed survivors'
      # job uploads none): the score's --sha reads it beside the shards'.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.empty != 'true'
        with:
          name: cargo-survivors
          path: survivors

      # A night is one tree (#423): before any figure is judged,
      # mutants_score.py --sha refuses the night, naming each shard and its
      # sha, unless every cargo shard, every hermetic shard and the survivors
      # name the dispatch's commit; the summary prints that commit above the
      # table, for the record's writer. A mutant is judged once (#400): a name
      # with more than one outcome in either pass refuses the night, named.
      # The target is 80 percent a file; a floor is the measured score rounded
      # down and only rises, with the tests that earn it (the rule in the
      # header). The measured night: run 40473522272, the last scheduled one
      # (#303), on beta at 2f8e6cf (2026-10-27, cargo-mutants 27.1.0, no
      # mutant timed out; docs/scoreboard/mutants.json). It judged 1,062 of
      # 1,168 mutants: shards 18 and 19 checked out 0bd48af and their
      # baselines timed out (#310), so 106 of handlers.rs's second copy (lines
      # 650 to 1248) were never judged; the first copy judged the same 106 (95
      # unviable, 11 caught), so its score stands. Each floor is the record's
      # score rounded down. One line a file:
      # - spend_gate.rs: 90.7 measured, floor 90.
      # - tracker_host.rs: 75.4 measured, floor 75; #175 raises it to 80.
      # - server/handlers.rs: 100.0 measured, floor 100 (#174).
      # - broadcast_verify.rs: 86.7 measured, floor 86 (#173).
      # - explorers.rs: 82.6 measured, floor 82 (#124).
      #
      # The two modes (#462): mutants_score.py --plan --record scores the
      # plan's files and carries every other floored file's figure from the
      # record's last complete run, naming the run and sha per file. Before
      # any figure it refuses a carried figure whose base is not the last
      # complete run, a plan against another base, a floor moved on an
      # incremental night (a floor moves only on a complete run) and an
      # outcome outside the plan. The night's record, every file with its
      # source, run and sha, is the artifact night-record, which the captain
      # commits over docs/scoreboard/mutants.json when the night is of record.
      # A declared equivalent (#482): --equivalents reads
      # docs/scoreboard/equivalents.json, scores each named mutant the night
      # missed as equivalent (outside the denominator, its own column), and
      # refuses the night naming an entry the night caught or a stale one.
      - name: Score per file against the floors
        env:
          MUTANTS_FLOORS: >-
            {"src/spend_gate.rs": 90,
             "src/tracker_host.rs": 75,
             "src/server/handlers.rs": 100,
             "src/broadcast_verify.rs": 86,
             "src/explorers.rs": 82}
          EMPTY: ${{ needs.plan.outputs.empty }}
          HSHARDS: ${{ needs.mutants-survivors.outputs.hermetic_shards }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p night
          args=(--plan plan/plan.json --record docs/scoreboard/mutants.json --run "$RUN"
                --write night/mutants.json --sha "$GITHUB_SHA"
                --equivalents docs/scoreboard/equivalents.json)
          if [ "$EMPTY" != "true" ]; then
            args+=(--survivors survivors)
            [ "$HSHARDS" = "0" ] || args+=(--hermetic hermetic)
            args+=(outcomes)
          fi
          python3 .github/nightly/mutants_score.py "${args[@]}"

      - name: Upload the night's record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: night-record
          path: night/mutants.json
          if-no-files-found: ignore
          retention-days: 30

  # The bench job's measure on the dispatched night (#142; the owner's word of
  # 2026-11-01: one nightly bench job on beta, an append by PR, nothing else
  # scheduled). No cron: beta has no schedule (the owner's word of 2026-10-27,
  # above), so a night is a dispatch, `gh workflow run nightly.yml --ref beta`.
  # The steps and pins are bench.yml's measure: rustc 1.98.1 in the env and
  # the action, the planted cases first, and tools/bench-compare --ci, which
  # holds the gate's profile, the CPU read (model and cores, the entry's key),
  # the sample floor and the history floor; criterion's warm-up calls are
  # dropped by the benches. The base is the checked-out commit's own
  # benches/baseline.json, so the candidate is that file with this night's
  # run appended, stamped with the commit and the run id; an entry that gates
  # (five runs) fails the night on a p99 over the margin, as on a PR.
  # After the Mutants matrix (#460: a complete night's shards run alone,
  # six at a time in four waves, #513), and after the fuzz targets and the
  # hermetic shards (#517: the stage under the cap, reach and bench last),
  # whatever each concluded, and one runner. The artifact
  # bench-night-<run id>-<CPU key> is what the captain appends to
  # benches/baseline.json, one night per PR: tools/bench-compare --append
  # (docs/BENCHES.md).
  #
  # Weekly (#462): the bench runs when the dispatch sets `bench` (the captain,
  # once a week; #303 allows no schedule) or on a complete night.
  bench:
    name: Bench (the night's candidate baseline)
    needs: [plan, mutants, fuzz, mutants-hermetic]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (inputs.bench || inputs.mode == 'complete') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Over any rust-toolchain.toml the ref carries; the tool refuses another rustc -V.
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The dispatched commit, the one --ci stamps (BENCH_COMMIT below).
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: The gate's planted cases
        run: python3 tools/test_bench_compare.py

      - name: Measure the night against the commit's own baseline
        id: measure
        env:
          BENCH_COMMIT: ${{ github.sha }}
        run: |
          key=$(tools/bench-compare --gate-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "bench: this runner's entry is $key"
          # A commit with no baseline file is a baseline with no entry.
          git show HEAD:benches/baseline.json > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null \
            || : > "$RUNNER_TEMP/base-baseline.json"
          mkdir -p "$RUNNER_TEMP/bench/results"
          BENCH_OUT="$RUNNER_TEMP/bench/results" tools/bench-compare --ci \
            --base "$RUNNER_TEMP/base-baseline.json" --out "$RUNNER_TEMP/bench/baseline.json"

      - name: Keep the night's candidate baseline under the run id and the CPU
        if: always() && steps.measure.outputs.key != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-night-${{ github.run_id }}-${{ steps.measure.outputs.key }}
          path: ${{ runner.temp }}/bench/
          if-no-files-found: warn
          retention-days: 30
