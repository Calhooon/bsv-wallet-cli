name: CI

# The machine gate. Branch protection on main requires the check names below:
# `Test`, `Rustfmt`, `Clippy`, `vectors` (the four of the ruling),
# `Build (ubuntu-latest)`, `deny` (the paved road's cargo-deny gate over the
# stack's template, adopted at 0.13.x) and `locks`. A push to main or beta runs
# exactly that set, the same as a pull request, nothing more (the owner's word
# of 2026-10-27: "sick of seeing all these CI failures... they are all so
# hardcore and slowing us down"). The measurements run on workflow_dispatch and
# once before a tag, each in its own workflow with its own badge, never on the
# push run: `nightly.yml` (the mutation score and the fuzz hours, #303) and
# `build-macos.yml`; beta also carries `bench.yml` and `differential.yml`;
# RELEASING.md names the hour. A run a newer push cancels (the concurrency
# group below) is never a red. Renaming a job removes its context and blocks
# every PR until the protection is updated. Every action is pinned by commit sha.
on:
  pull_request:
    branches: [main, beta]
  push:
    branches: [main, beta]
  # release.yml runs the same jobs on a tag before it publishes.
  workflow_call:

permissions:
  contents: read

# A newer push to the same ref supersedes the run; a tag's run is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Ubuntu alone on every event (the owner's word of 2026-10-27: a push runs
        # exactly the required set, the same as a pull request, nothing more);
        # the macOS build is build-macos.yml on workflow_dispatch; the tag's Binaries
        # job in release.yml builds the macOS targets.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build workspace (release)
        run: cargo build --release --locked

      - name: Build MCP subcrate (release)
        run: cargo build --release --locked -p bsv-wallet-mcp

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Every target of the workspace, not the synthetic integration tests
      # alone: the unit tests and the witnesses of the 0.3.x and 0.4.0 fixes
      # (the callback intake, the tracker-off refusals) live in the others.
      - name: Run the workspace's tests
        run: cargo test --workspace --locked

  # The vector-backed tests as one named check: the Arcade status vector
  # (tests/vectors/arcade_status_verdicts.json, the toolbox's file) through the
  # webhook intake, and the gift covenant's sCrypt parity vectors
  # (src/gift/covenant_vectors.json).
  vectors:
    name: vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: The vector files are present
        run: |
          test -s tests/vectors/arcade_status_verdicts.json
          test -s src/gift/covenant_vectors.json

      - name: Run the Arcade status vector through the webhook intake
        run: cargo test --locked --test arcade_webhook_vector_tests

      # A filter that matches nothing passes; the grep refuses a renamed module.
      - name: Run the covenant vectors
        run: |
          set -o pipefail
          cargo test --locked --lib gift::covenant::tests:: | tee covenant.log
          grep -q 'test result: ok. 5 passed' covenant.log

  # The paved road's deny job, from bsv-stack-lean template/ci.yml: deny.toml is
  # the template byte for byte (its sha256 stamped in template/stack.toml), then
  # cargo-deny 0.20.2 from a temporary root checks advisories, bans, licenses and
  # sources against the committed lock.
  deny:
    name: deny
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","studio"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The migration lane copies the stamped manifest too. No network trust
      # or moving branch controls equality; updating the stamp is a line change.
      - name: Check adopted template hash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, tomllib
          stamp = tomllib.loads(pathlib.Path('template/stack.toml').read_text())['deny']
          assert hashlib.sha256(pathlib.Path('deny.toml').read_bytes()).hexdigest() == stamp['sha256'], 'deny.toml differs from the adopted line'
          PY
      - run: cargo install cargo-deny --version 0.20.2 --locked --root "$RUNNER_TEMP/paved-road-tools"
      - run: '"$RUNNER_TEMP/paved-road-tools/bin/cargo-deny" --locked check'

  # One bsv-rs per lock (bsv-stack-lean #182): a committed Cargo.lock holding
  # two bsv-rs entries fails, the gate a self-merging stack PR stands behind.
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: One bsv-rs per committed Cargo.lock
        run: |
          set -euo pipefail
          status=0
          found=0
          while IFS= read -r -d '' lock; do
            found=$((found + 1))
            n=$(grep -c '^name = "bsv-rs"$' "$lock" || true)
            echo "$lock: $n bsv-rs"
            if [ "$n" -gt 1 ]; then
              echo "::error file=$lock::$n bsv-rs entries; one bsv-rs per lock"
              status=1
            fi
          done < <(git ls-files -z -- 'Cargo.lock' '*/Cargo.lock')
          [ "$found" -gt 0 ] || echo "no committed Cargo.lock"
          exit "$status"
