name: CI

# The machine gate. Branch protection on main requires the check names below:
# `Test`, `Rustfmt`, `Clippy`, `vectors` (the four of the ruling), the two
# `Build (...)` checks that were already required, and `deny` (the paved road's
# cargo-deny gate over the stack's template, adopted at 0.13.x). `wire` (#69)
# is to be required on `beta` by the captain; `bench` (#71) gates once the
# entry for its runner CPU carries five runs. Renaming a job removes its
# context and blocks every PR until the protection is updated. Every action is
# pinned by commit sha.
on:
  pull_request:
    branches: [main, beta]
  push:
    branches: [main, beta]
  # release.yml runs the same jobs on a tag before it publishes.
  workflow_call:

permissions:
  contents: read

# A newer push to the same ref supersedes the run; a tag's run is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build workspace (release)
        run: cargo build --release --locked

      - name: Build MCP subcrate (release)
        run: cargo build --release --locked -p bsv-wallet-mcp

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Every target of the workspace, not the synthetic integration tests
      # alone: the unit tests and the witnesses of the 0.3.x and 0.4.0 fixes
      # (the callback intake, the tracker-off refusals) live in the others.
      - name: Run the workspace's tests
        run: cargo test --workspace --locked

  # The vector-backed tests as one named check: the Arcade status vector
  # (tests/vectors/arcade_status_verdicts.json, the toolbox's file) through the
  # webhook intake, and the gift covenant's sCrypt parity vectors
  # (src/gift/covenant_vectors.json).
  vectors:
    name: vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: The vector files are present
        run: |
          test -s tests/vectors/arcade_status_verdicts.json
          test -s src/gift/covenant_vectors.json

      - name: Run the Arcade status vector through the webhook intake
        run: cargo test --locked --test arcade_webhook_vector_tests

      # A filter that matches nothing passes; the grep refuses a renamed module.
      - name: Run the covenant vectors
        run: |
          set -o pipefail
          cargo test --locked --lib gift::covenant::tests:: | tee covenant.log
          grep -q 'test result: ok. 5 passed' covenant.log

  # The wire oracle (#69): every served call and refusal body under
  # tests/wire/, replayed against the router in-process. A PR that changes a
  # response byte fails here unless it changes the fixture too (docs/WIRE.md).
  wire:
    name: wire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: The fixtures and their manifest are present
        run: ls tests/wire/*.json > /dev/null && test -f tests/wire/MANIFEST.json

      # Replay only. A recording never passes (the test fails with the word
      # to replay it), and this job refuses to start one: WIRE_RECORD set to
      # anything fails here before cargo runs.
      - name: WIRE_RECORD is not set
        run: |
          if [ -n "${WIRE_RECORD+set}" ]; then
            echo "WIRE_RECORD is set (${WIRE_RECORD}); the wire job replays, never records"
            exit 1
          fi

      - name: Replay the wire fixtures
        run: cargo test --locked --test wire

      - name: No fixture was written by the run
        run: git diff --exit-code -- tests/wire && test -z "$(git status --porcelain -- tests/wire)"

  # The hot path's benches (#71). tools/bench-compare --ci holds the gate's
  # profile, margin, sample floor and history floor as constants; nothing
  # here names them (docs/BENCHES.md). The job checks out the PR's head and
  # stamps the candidate baseline with that sha, measures into a directory
  # of its own, and checks the tree's benches/baseline.json against the
  # base ref's (read as the ratchet job reads its record: the base branch's
  # tip on a PR, the commit before on a push): a changed margin, a dropped
  # entry or bench id, a rewritten run, or a new run that does not match
  # this run's measure or is over the base's reference fails. The reference is the base's entry, never the
  # tree's; the comparison gates once the base's entry for this runner's CPU
  # carries five runs; until then it warns and passes, and with no base
  # nothing is gated. A runner CPU with no entry gates nothing and says so
  # in an annotation and the step summary. The artifact bench-baseline is
  # the candidate the captain commits: the base's file with this run appended.
  bench:
    name: bench
    runs-on: ubuntu-latest
    env:
      # Over any rust-toolchain.toml a PR adds; the tool refuses another rustc -V.
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: The gate's planted cases
        run: python3 tools/test_bench_compare.py

      - name: No p99 above the base's baseline
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          BENCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rev=""
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            rev="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ]; then
            if git fetch --no-tags --depth=1 origin "$BEFORE"; then
              rev="$BEFORE"
            else
              echo "::warning::the commit before the push ($BEFORE) is not fetchable"
            fi
          fi
          base=()
          if [ -n "$rev" ]; then
            # A base with no baseline file is a baseline with no entry.
            git show "$rev:benches/baseline.json" > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null \
              || : > "$RUNNER_TEMP/base-baseline.json"
            echo "bench: the base baseline is $rev:benches/baseline.json"
            base=(--base "$RUNNER_TEMP/base-baseline.json")
          fi
          mkdir -p "$RUNNER_TEMP/bench/results"
          BENCH_OUT="$RUNNER_TEMP/bench/results" tools/bench-compare --ci "${base[@]}" \
            --out "$RUNNER_TEMP/bench/baseline.json"

      - name: Keep the measured JSON and the candidate baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-baseline
          path: ${{ runner.temp }}/bench/
          if-no-files-found: warn

  # The paved road's deny job, from bsv-stack-lean template/ci.yml: deny.toml is
  # the template byte for byte (its sha256 stamped in template/stack.toml), then
  # cargo-deny 0.20.2 from a temporary root checks advisories, bans, licenses and
  # sources against the committed lock.
  deny:
    name: deny
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","studio"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The migration lane copies the stamped manifest too. No network trust
      # or moving branch controls equality; updating the stamp is a line change.
      - name: Check adopted template hash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, tomllib
          stamp = tomllib.loads(pathlib.Path('template/stack.toml').read_text())['deny']
          assert hashlib.sha256(pathlib.Path('deny.toml').read_bytes()).hexdigest() == stamp['sha256'], 'deny.toml differs from the adopted line'
          PY
      - run: cargo install cargo-deny --version 0.20.2 --locked --root "$RUNNER_TEMP/paved-road-tools"
      - run: '"$RUNNER_TEMP/paved-road-tools/bin/cargo-deny" --locked check'

  # One bsv-rs per lock (bsv-stack-lean #182): a committed Cargo.lock holding
  # two bsv-rs entries fails, the gate a self-merging stack PR stands behind.
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: One bsv-rs per committed Cargo.lock
        run: |
          set -euo pipefail
          status=0
          found=0
          while IFS= read -r -d '' lock; do
            found=$((found + 1))
            n=$(grep -c '^name = "bsv-rs"$' "$lock" || true)
            echo "$lock: $n bsv-rs"
            if [ "$n" -gt 1 ]; then
              echo "::error file=$lock::$n bsv-rs entries; one bsv-rs per lock"
              status=1
            fi
          done < <(git ls-files -z -- 'Cargo.lock' '*/Cargo.lock')
          [ "$found" -gt 0 ] || echo "no committed Cargo.lock"
          exit "$status"

  # The ratchet (#72): seven numbers of the tree that may only fall, measured
  # by tools/ratchet (docs/RATCHETS.md). The tree is checked against the
  # record of the base, read from the base ref and never from the PR's own
  # docs/ratchets.json (a PR that edited the record would pass itself): on a
  # PR the base branch's tip, on a push the commit before it. The PR's record
  # may lower the base's numbers, never raise one. A base with no record yet
  # checks the tree against this tree's record alone. The toolchain is pinned
  # to the record's: a new clippy brings new pedantic lints, and the numbers
  # would move with no change to the tree. The measured JSON is kept as the
  # run's artifact `ratchets`.
  ratchet:
    name: ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: No number above the base's record
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          rev=""
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            rev="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ]; then
            if git fetch --no-tags --depth=1 origin "$BEFORE"; then
              rev="$BEFORE"
            else
              echo "::warning::the commit before the push ($BEFORE) is not fetchable"
            fi
          fi
          base=()
          if [ -n "$rev" ] && git show "$rev:docs/ratchets.json" > "$RUNNER_TEMP/base-ratchets.json" 2>/dev/null; then
            echo "ratchet: the base record is $rev:docs/ratchets.json"
            base=(--base "$RUNNER_TEMP/base-ratchets.json")
          else
            echo "::notice::no base record (${rev:-no base ref}): the tree is checked against its own docs/ratchets.json alone"
          fi
          mkdir -p "$RUNNER_TEMP/ratchet"
          python3 tools/ratchet --check "${base[@]}" --out "$RUNNER_TEMP/ratchet/ratchets.json"

      - name: Keep the measured JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ratchets
          path: ${{ runner.temp }}/ratchet/
          if-no-files-found: warn

  # The hermetic e2e suite (#74, docs/E2E-HERMETIC.md): the 23 scenarios of
  # tests/e2e against a local stub of the header service, the three explorers
  # and the broadcaster (tests/e2e/stub), with the proxy environment walling
  # every other host: every request from the binary and the harness becomes a
  # CONNECT the stub refuses and counts (Node 24 with NODE_USE_ENV_PROXY=1 for
  # the harness's own fetch; Chromium by its launch args). The wall binds the
  # clients that honour it; the runner's egress is not blocked at the OS
  # (docs/E2E-HERMETIC.md, "The wall"). No sat moves; a walled attempt at a
  # host other than the toolbox's two knobless providers, an unserved stub
  # route or unread stats fails the run. The mainnet run stays the release
  # gate. On failure the kept wallet directories (keys and serve.log), the
  # stub's log and the run's log are uploaded.
  e2e-hermetic:
    name: e2e-hermetic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The runner context is not available in a job's env; the wallets' tmp
    # directory is set on the step that runs the harness.
    env:
      NODE_USE_ENV_PROXY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the release binaries the harness drives
        run: |
          cargo build --release --locked
          cargo build --release --locked -p bsv-wallet-mcp

      # Node 24: its fetch and http obey the proxy environment under
      # NODE_USE_ENV_PROXY=1 (Node 20 ignores it).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      # Scenario 20 drives the inspector UI through Playwright's Chromium;
      # the browser is cached by the lock file, its system libraries are not.
      - name: Install the harness's dependency (Playwright)
        working-directory: tests/e2e
        run: npm ci

      - name: Cache Playwright's Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run the 23 scenarios against the stub
        env:
          E2E_WALLET_TMP: ${{ runner.temp }}/e2e
        run: |
          set -o pipefail
          mkdir -p "$E2E_WALLET_TMP"
          node --version
          E2E_HERMETIC=1 node tests/e2e/run.js 2>&1 | tee "$E2E_WALLET_TMP/run.log"

      - name: Keep the wallets, the stub's log and the run's log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-hermetic-kept
          path: ${{ runner.temp }}/e2e/
          if-no-files-found: ignore

  # The differential oracle (#70, docs/DIFFERENTIAL.md): the PR's base branch
  # at its tip and the PR's head, both built here with the ratchet's pinned
  # toolchain, each run once through the hermetic suite with the same keys,
  # ports and stub, the two recordings compared byte for byte after the
  # normalizations tools/differential lists (`--exclusions`). It is to fail
  # on differences only when the PR carries the label `refactor` (a feature
  # PR changes outputs by design, and its differences are its review's
  # reading), but that failure is held (REFACTOR_FAILS below) until
  # bsv-wallet-toolbox-rs #105, the coin tie, is pinned: until then two runs
  # of one binary can differ from scenario 22 on, and a refactor PR's report
  # carries the floor pair's numbers beside its own (docs/DIFFERENTIAL.md).
  # A failed build or suite run, or an incomplete recording (exit 3), fails
  # it either way. The labels are read when the differential step runs, with
  # `gh pr view --json labels`, never from the event payload (a re-run reuses
  # the payload of the event that started it): a label added after the run
  # started counts on a re-run of this job. Label changes do not trigger CI
  # (labeled/unlabeled would re-run, and cancel, every job of this workflow).
  # Not a required check yet: the captain decides after it has run a week.
  # The report is the run's artifact `differential`, and its DIFFERENTIAL
  # line is in the summary.
  differential:
    name: differential
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    env:
      NODE_USE_ENV_PROXY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The base's tree in a worktree beside the checkout, built into the same
      # target dir before the head (the dependencies are shared), its two
      # binaries copied out before the head's build replaces them.
      - name: Build the base (the PR's base branch at its tip)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git worktree add --detach "$RUNNER_TEMP/base-src" "origin/$BASE_REF"
          echo "base: $(git -C "$RUNNER_TEMP/base-src" log --oneline -1)"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          (cd "$RUNNER_TEMP/base-src" && cargo build --release --locked && cargo build --release --locked -p bsv-wallet-mcp)
          mkdir -p "$RUNNER_TEMP/bin-base"
          cp target/release/bsv-wallet target/release/bsv-wallet-mcp "$RUNNER_TEMP/bin-base/"

      - name: Build the head
        run: |
          set -euo pipefail
          cargo build --release --locked
          cargo build --release --locked -p bsv-wallet-mcp
          mkdir -p "$RUNNER_TEMP/bin-head"
          cp target/release/bsv-wallet target/release/bsv-wallet-mcp "$RUNNER_TEMP/bin-head/"

      # Node 24 for NODE_USE_ENV_PROXY, and scenario 20's Chromium, as the
      # e2e-hermetic job has them.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Install the harness's dependency (Playwright)
        working-directory: tests/e2e
        run: npm ci

      - name: The tool's own tests (its planted cases)
        run: python3 tools/test_differential.py -v

      - name: The differential step's exit mapping (a stand-in tool, each code and label)
        run: bash tools/test_differential_step.sh

      - name: Cache Playwright's Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run the differential
        env:
          # Held: `false` until bsv-wallet-toolbox-rs #105 (the coin tie) is
          # pinned; then `true`, and a refactor PR with differences fails.
          REFACTOR_FAILS: 'false'
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The shell runs with -e (GitHub's `bash -e {0}`, and the set below
        # says so): the tool's exit is captured with `&& code=0 || code=$?`,
        # never a bare call then `code=$?`, which -e aborts on exit 1 before
        # the mapping reads it. tools/test_differential_step.sh runs this
        # body against a stand-in tool for each exit code and label state.
        run: |
          set -euo pipefail
          # The PR's labels now, not the event's (a label added after the
          # run started counts on a re-run). A failed read is no "no label".
          if ! REFACTOR=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels \
              --jq '[.labels[].name] | index("refactor") != null'); then
            echo "::error::the PR's labels could not be read (gh pr view)"
            exit 1
          fi
          echo "label refactor: $REFACTOR (read at run time)"
          out="$RUNNER_TEMP/differential"
          mkdir -p "$out"
          python3 tools/differential \
            --base-bin "$RUNNER_TEMP/bin-base/bsv-wallet" \
            --head-bin "$RUNNER_TEMP/bin-head/bsv-wallet" \
            --out "$out" && code=0 || code=$?
          line=$(grep '^DIFFERENTIAL:' "$out/report.txt" 2>/dev/null || echo "DIFFERENTIAL: no report (exit $code)")
          {
            echo "### differential"
            echo
            echo "\`$line\`"
            echo
            echo "label refactor: $REFACTOR (read at run time); the refactor failure: $([ "$REFACTOR_FAILS" = true ] && echo on || echo 'held until bsv-wallet-toolbox-rs #105'); the report is the artifact \`differential\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 3 ]; then
            echo "::error::$line: a recording is not a whole run (its INCOMPLETE lines in the report)"
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::a build's suite run failed (exit $code); see the report and the run logs"
            exit 1
          fi
          if [ "$code" -eq 1 ]; then
            if [ "$REFACTOR" = "true" ] && [ "$REFACTOR_FAILS" = "true" ]; then
              echo "::error::$line on a PR labelled refactor"
              exit 1
            fi
            if [ "$REFACTOR" = "true" ]; then
              echo "::warning::$line on a PR labelled refactor: reported, the failure held until bsv-wallet-toolbox-rs #105 is pinned; read it against the floor pair's (docs/DIFFERENTIAL.md)"
            else
              echo "::notice::$line (no refactor label: reported, not failed)"
            fi
            exit 0
          fi
          echo "::notice::$line"

      # The report, the recordings and the run logs; never the wallets'
      # directories a failed run keeps under --out (their .env holds the
      # root keys). The recordings name each key <root-key:SEAT>.
      - name: Keep the report and the recordings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: differential
          path: |
            ${{ runner.temp }}/differential/
            !${{ runner.temp }}/differential/*-wallets/
          if-no-files-found: warn
