name: CI

# The machine gate. Branch protection requires exactly the checks a pull
# request runs (the keeper's rule of 2026-10-26): on main `Test`, `lint`,
# `vectors` and `Build (ubuntu-latest)`; on beta those and `wire` (#69) and
# `e2e-hermetic`. `lint` (#471) is the five lint gates in one job, each its
# own named step: Rustfmt and Clippy (with Test and vectors the four of the
# ruling), `locks`, `deny` (the paved road's cargo-deny gate over the stack's
# template, adopted at 0.13.x) and the ratchet, which main now requires
# within it. A push to beta or main runs exactly that set, the same as a
# pull request, nothing more; so does a merge-queue group (#451: beta lands
# through GitHub's merge queue, and the queue waits on the same required
# contexts for the group's commit) (the owner's word of 2026-10-27: "sick of seeing
# all these CI failures... they are all so hardcore and slowing us down").
# The measurements run on workflow_dispatch and once before a tag, each in its
# own workflow with its own badge, never on the push run: `bench.yml` (#71),
# `differential.yml` (#70), `nightly.yml` (the mutation score and the fuzz
# hours, #303) and `build-macos.yml`; RELEASING.md names the hour. A run a
# newer push cancels (the concurrency group below) is never a red. Renaming a
# job removes its context and blocks every PR until the protection is updated.
# A docs-only change (#476) runs the same six jobs, each reporting its context:
# the `changes` job at the head reads the changed paths once and every
# required job's steps skip on its `docs_only` (never the job, whose context
# would then go missing), all but `lint`'s docs gates. `changes` is not a
# required context; when it fails, every job runs the full set. On a pull
# request (#473), Test and wire run the test targets the diff reaches
# (.github/ci/affected.py, the incremental Nightly's oracle, read by
# `changes`) and lint's deny runs when a path it reads changed; a merge-queue
# group, a push and a tag run the whole suite. The same contexts report in
# both modes, each job's log naming its selection: a PR's green is the
# reached tests', the queue's green is the suite's.
# Every action is pinned by commit sha.
on:
  pull_request:
    branches: [main, beta]
  push:
    branches: [main, beta]
  # The merge queue's group commit (#451). Its ref is
  # refs/heads/gh-readonly-queue/<base>/pr-<n>-<sha>, one per group, so the
  # concurrency group below never cancels one group for another.
  merge_group:
    types: [checks_requested]
  # release.yml runs the same jobs on a tag before it publishes.
  workflow_call:

permissions:
  contents: read

# A newer push to the same ref supersedes the run; a tag's run is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # The cached build (#472). No CI step reads a test binary's debuginfo
  # (a panic names its line without it), and it was most of the link and
  # of the cache, so the dev and test profiles build none. Incremental is
  # off: CI builds each commit once and never reuses incremental's state.
  # rust-cache (v2.9.2, restore.ts) already exports CARGO_INCREMENTAL=0
  # after its restore, before any cargo step; it is set here so every step
  # says it. rust-cache hashes every CARGO* and RUST* variable into its key,
  # so these move every key once, and a job-level one would split the keys
  # that jobs share.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  # The Markdown the code reads, which is never docs (#476): GIFT.md by
  # include_str! (src/commands/gift_chain.rs) and the extensions page by
  # tests/brc100.rs. lint's step "the docs set" fails on a read not named here.
  DOCS_READ_BY_CODE: GIFT.md docs/BRC-100-EXTENSIONS.md
  # tests/ and fuzz/ are code-scanned folders, never docs (#476): a harness
  # reads every file of a folder there (the wire manifest, the consumers'
  # lists, the fuzz corpora, the vectors, the e2e scenarios), so a .md placed
  # in one is a test's input. The prose there is named here, file by file,
  # never a glob.
  PROSE_IN_CODE_FOLDERS: tests/e2e/README.md

jobs:
  # The changed paths, read once (#476). docs_only is true when every changed
  # path is docs: the issue's `docs/**`, `**/*.md`, `HANDOFF.md`, `CHANGELOG.md`
  # and `changelog.d/**`, read as prose, which is every path ending `.md` but
  # DOCS_READ_BY_CODE and every path under tests/ or fuzz/ (a code-scanned
  # folder is never docs) but PROSE_IN_CODE_FOLDERS. docs/'s records
  # (ratchets.json, scoreboard/, brc100/) are the gates' inputs, and a
  # scenario, a fixture, a workflow, a tool or any code is not docs. The diff, renames split into their two paths: on a PR the
  # merge commit against HEAD^1 (the PR's base as merged); on a
  # merge-queue group its base_sha to its head_sha (as #451's base ref); on a
  # push to a branch the commit before it to the commit. Anything else (a tag's
  # run through workflow_call, an unreadable base, no changed path) is false:
  # the full set. The answer never fails the job; a failed job leaves the
  # output empty, and empty is not true. The rule is .github/ci/docs_only.sh
  # (#509), whose every gate input tools/test_docs_only.py plants and proves.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      # The tests a PR runs (#473), from .github/ci/affected.py; each is
      # empty, which every reader takes as the whole suite, off the success path.
      test_args: ${{ steps.diff.outputs.test_args }}
      test_run: ${{ steps.diff.outputs.test_run }}
      wire: ${{ steps.diff.outputs.wire }}
      deny: ${{ steps.diff.outputs.deny }}
      selection: ${{ steps.diff.outputs.line }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The history's commits and trees, no blob but the checkout's.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: The changed paths
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          GROUP_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          GROUP_HEAD: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
        run: bash .github/ci/docs_only.sh

  # The lint gates in one job (#471): Rustfmt, locks, deny, Clippy and the
  # ratchet, with one checkout and one cache restore. Their setup (a runner,
  # a checkout, a toolchain, a cache) was the larger share of Rustfmt, locks
  # and deny, and every job waits for one of the org's runners before its
  # setup starts. Each gate is its own named step and fails by name: every
  # gate runs when the setup succeeded (`steps.cache.outcome`), whatever an
  # earlier gate said, so one red names every failing gate. The checkout is
  # the event's commit (on a PR the merge commit, as every other job), whole
  # history for check-cites and the ratchet's base; deny reads the PR's head
  # as its own job did, from a worktree of that commit. No token is left in
  # the checkout (deny's `persist-credentials: false`): the ratchet's fetches
  # are a public repository's, and the changelog step passes its own token.
  # The toolchains: 1.98.1 with clippy for the ratchet (pinned to the
  # record's, set per step), then stable with rustfmt and clippy, the
  # default, before the cache step so its key considers both. The runner is
  # GitHub-hosted ubuntu-latest (#497).
  # On a docs-only change (#476) the toolchains and the cache are skipped, so
  # every Rust gate and the ratchet skip with them; the docs set's guard, The
  # base ref, scoreboard, links and citations and the changelog fragment run:
  # a docs PR still passes its own checks, under the required `lint` context.
  lint:
    name: lint
    needs: changes
    # Never skipped (a skipped job's context passes the protection unread): a
    # failed `changes` leaves docs_only empty, and every gate runs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: docs-only PR
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: 'echo "docs-only PR: lint skipped by #476 (its Rust gates and the ratchet; its docs gates run)"'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # check-cites reads the document's pin and proves its ancestry.
          fetch-depth: 0
          persist-credentials: false

      # Every .md path the code or the e2e harness reads must be named in
      # DOCS_READ_BY_CODE, or a docs-only change could skip the test that
      # reads it. The search is literal: a read through a computed path is
      # the reviewer's to name.
      - name: "the docs set: the Markdown the code reads"
        run: |
          set -euo pipefail
          read_md=$( { git grep -hoE '(include_str!|include_bytes!|read_to_string|readFileSync|readFile)\([^;]*\.md' -- '*.rs' '*.js' || true; } \
            | grep -oE '[A-Za-z0-9_.-]+\.md$' | sort -u || true)
          status=0
          for name in $read_md; do
            named=false
            for path in $DOCS_READ_BY_CODE; do
              if [ "$(basename "$path")" = "$name" ]; then named=true; fi
            done
            echo "read by the code: $name (named in DOCS_READ_BY_CODE: $named)"
            if [ "$named" != true ]; then
              echo "::error::$name is read by the code and is not in DOCS_READ_BY_CODE (ci.yml); a docs-only change to it would skip its test"
              status=1
            fi
          done
          exit "$status"

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          toolchain: 1.98.1
          components: clippy

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Saved by a push to beta or main alone (#472); see Test's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: cache
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main') }}

      - name: Rustfmt
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo fmt --all -- --check

      # One bsv-rs per lock (bsv-stack-lean #182): a committed Cargo.lock holding
      # two bsv-rs entries fails, the gate a self-merging stack PR stands behind.
      # One bsv-rs per lock is not enough alone: on beta.1 fuzz/Cargo.lock
      # held one bsv-rs, 0.8.2, beside the root's 0.9.0-beta.1, and the fuzz
      # crate stopped building (#301). Every other committed lock holds the
      # root lock's version of each crate of the stack.
      - name: "locks: one bsv-rs per committed Cargo.lock, the stack at the root's versions"
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: |
          set -euo pipefail
          status=0
          found=0
          version() { { grep -A1 "^name = \"$2\"$" "$1" || true; } | sed -n 's/^version = "\(.*\)"$/\1/p' | sort -u | paste -sd, -; }
          stack="bsv-rs bsv-wallet-toolbox-rs bsv-tracker"
          while IFS= read -r -d '' lock; do
            found=$((found + 1))
            n=$(grep -c '^name = "bsv-rs"$' "$lock" || true)
            echo "$lock: $n bsv-rs"
            if [ "$n" -gt 1 ]; then
              echo "::error file=$lock::$n bsv-rs entries; one bsv-rs per lock"
              status=1
            fi
            [ "$lock" = Cargo.lock ] && continue
            for crate in $stack; do
              ours=$(version "$lock" "$crate")
              root=$(version Cargo.lock "$crate")
              echo "$lock: $crate ${ours:-none} (Cargo.lock: ${root:-none})"
              if [ -n "$ours" ] && [ "$ours" != "$root" ]; then
                echo "::error file=$lock::$crate $ours, the root lock's is ${root:-none}; a pin moves every committed lock"
                status=1
              fi
            done
          done < <(git ls-files -z -- 'Cargo.lock' '*/Cargo.lock')
          [ "$found" -gt 0 ] || echo "no committed Cargo.lock"
          exit "$status"

      # The paved road's deny gate, from bsv-stack-lean template/ci.yml:
      # deny.toml is the template byte for byte (its sha256 stamped in
      # template/stack.toml), then cargo-deny 0.20.2 (the pinned prebuilt
      # release, #507) checks advisories, bans, licenses and sources against
      # the committed lock. Its tree is the PR's head on a pull request and the event's
      # commit otherwise (a push, a merge-queue group), as its own job's
      # checkout was. On a PR it runs when a path it reads changed (#473:
      # the manifests, the lockfile, deny.toml, the template's stamp,
      # ci.yml); a merge-queue group, a push and a tag always run it, so an
      # advisory published since the lock last moved reds the queue, never a
      # PR that did not touch the lock.
      - name: "deny: the paths it reads"
        if: ${{ !cancelled() && steps.cache.outcome == 'success' && needs.changes.outputs.deny == 'false' }}
        run: 'echo "deny: no path cargo-deny reads changed: skipped by #473 (the queue runs it)"'

      - name: "deny: the tree"
        id: deny-tree
        if: ${{ !cancelled() && steps.cache.outcome == 'success' && needs.changes.outputs.deny != 'false' }}
        env:
          DENY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/deny-tree" "$DENY_REF"
          echo "deny: the tree is $DENY_REF"
          echo "dir=$RUNNER_TEMP/deny-tree" >> "$GITHUB_OUTPUT"

      # The migration lane copies the stamped manifest too. No network trust
      # or moving branch controls equality; updating the stamp is a line change.
      - name: "deny: check adopted template hash"
        if: ${{ !cancelled() && steps.deny-tree.outcome == 'success' }}
        working-directory: ${{ steps.deny-tree.outputs.dir }}
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, tomllib
          stamp = tomllib.loads(pathlib.Path('template/stack.toml').read_text())['deny']
          assert hashlib.sha256(pathlib.Path('deny.toml').read_bytes()).hexdigest() == stamp['sha256'], 'deny.toml differs from the adopted line'
          PY

      # cargo-deny 0.20.2 as the pinned prebuilt release, never compiled here
      # (#507: the `cargo install` took 119 s of every run). The version and
      # the tarball's sha256 move together, by PR only: the sum was read once
      # from the release's own `.sha256` asset beside the tarball, and any
      # other sum fails the step. If the musl build ever cannot run the check
      # below, the release's x86_64-unknown-linux-gnu tarball is the fallback
      # (its own pinned sum). The binary goes to ~/.cargo/bin (on PATH) and is
      # linked at the temporary root the check step names.
      - name: "deny: install cargo-deny 0.20.2"
        id: deny-install
        if: ${{ !cancelled() && steps.deny-tree.outcome == 'success' }}
        env:
          DENY_VERSION: "0.20.2"
          DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          set -euo pipefail
          name="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/$name.tar.gz"
          echo "${DENY_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" "$name/cargo-deny"
          mkdir -p "$HOME/.cargo/bin" "$RUNNER_TEMP/paved-road-tools/bin"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          ln -sf "$HOME/.cargo/bin/cargo-deny" "$RUNNER_TEMP/paved-road-tools/bin/cargo-deny"
          cargo deny --version

      - name: "deny: cargo-deny check"
        if: ${{ !cancelled() && steps.deny-install.outcome == 'success' }}
        working-directory: ${{ steps.deny-tree.outputs.dir }}
        run: '"$RUNNER_TEMP/paved-road-tools/bin/cargo-deny" --locked check'

      - name: Clippy
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The ratchet (#72): eight numbers of the tree that may only fall, measured
      # by tools/ratchet (docs/RATCHETS.md). The tree is checked against the
      # record of the base, read from the base ref and never from the PR's own
      # docs/ratchets.json (a PR that edited the record would pass itself): on a
      # PR the base branch's tip, on a push the commit before it, on a merge-queue
      # group the group's parent commit (the event's merge_group.base_sha, beta
      # or the group queued ahead, an ancestor of the group's head). The PR's record
      # may lower the base's numbers, never raise one. A base with no record yet
      # checks the tree against this tree's record alone. The toolchain is pinned
      # to the record's: a new clippy brings new pedantic lints, and the numbers
      # would move with no change to the tree. The measured JSON is kept as the
      # run's artifact `ratchets`.
      # The base ref, read once for the ratchet and the scoreboard: on a PR
      # the base branch's tip, on a push the commit before it, none on a
      # push with no fetchable before; on a merge-queue group its parent
      # commit, and an unfetchable parent fails (a group is never checked
      # against its own record alone).
      # Never with --depth here: a depth-limited fetch into the full checkout
      # above turns the clone shallow, and check-cites' ancestry proof (the
      # pin reachable from HEAD) then fails with git exit 1.
      - name: The base ref
        id: base
        if: ${{ !cancelled() && (steps.cache.outcome == 'success' || needs.changes.outputs.docs_only == 'true') }}
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          GROUP_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          rev=""
          if [ "$EVENT" = merge_group ]; then
            if [ -z "$GROUP_BASE" ] || ! git fetch --no-tags origin "$GROUP_BASE"; then
              echo "::error::the merge group's parent commit (${GROUP_BASE:-empty}) is not fetchable"
              exit 1
            fi
            rev="$GROUP_BASE"
          elif [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            rev="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ]; then
            if git fetch --no-tags origin "$BEFORE"; then
              rev="$BEFORE"
            else
              echo "::warning::the commit before the push ($BEFORE) is not fetchable"
            fi
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: No number above the base's record
        if: ${{ !cancelled() && steps.base.outcome == 'success' && needs.changes.outputs.docs_only != 'true' }}
        env:
          REV: ${{ steps.base.outputs.rev }}
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          rev="$REV"
          base=()
          has_base=false
          if [ -n "$rev" ]; then
            record="$rev:docs/ratchets.json"
            # A failed read is not proof of absence: a bad ref or corrupt
            # object must fail. Git versions return 1 or 128 for a missing
            # path; confirm the named path is absent from a readable tree.
            if LC_ALL=C git cat-file -e "$record" 2> "$RUNNER_TEMP/base-record-error"; then
              if ! git show "$record" > "$RUNNER_TEMP/base-ratchets.json"; then
                echo "::error::ratchet: git show failed for $record"
                exit 1
              fi
              has_base=true
            else
              code=$?
              if { [ "$code" -eq 1 ] || [ "$code" -eq 128 ]; } \
                && grep -Eq 'does not exist|Not a valid object name|exists on disk, but not in' "$RUNNER_TEMP/base-record-error" \
                && entries=$(git ls-tree "$rev" -- docs/ratchets.json) && [ -z "$entries" ]; then
                : # Only a missing path may take the notice branch below.
              else
                cat "$RUNNER_TEMP/base-record-error" >&2
                echo "::error::ratchet: git cat-file -e failed for $record (exit $code)"
                exit 1
              fi
            fi
          fi
          if [ "$has_base" = true ]; then
            echo "ratchet: the base record is $rev:docs/ratchets.json"
            base=(--base "$RUNNER_TEMP/base-ratchets.json")
            python3 tools/ratchet --fingerprint > "$RUNNER_TEMP/head-fingerprint.json"
            python3 - "$rev" > "$RUNNER_TEMP/base-fingerprint.json" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys

          files = {"ratchet": "tools/ratchet", "clippy_toml": "tools/ratchet.d/clippy.toml"}
          print(json.dumps({key: hashlib.sha256(subprocess.check_output(
              ["git", "show", f"{sys.argv[1]}:{path}"])).hexdigest()
              for key, path in files.items()}, indent=2))
          PY
            if ! cmp -s "$RUNNER_TEMP/head-fingerprint.json" "$RUNNER_TEMP/base-fingerprint.json"; then
              # Records from different instruments cannot be compared. The
              # base's instrument still guards the PR's tree against a raise.
              base_tree=$(mktemp -d "$RUNNER_TEMP/ratchet-base.XXXXXX")
              trap 'git worktree remove --force "$base_tree"' EXIT
              git worktree add --detach "$base_tree" HEAD
              (
                # The job's own target dir: the scratch worktree would otherwise
                # build the workspace cold a second time under its own target/.
                export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
                cd "$base_tree"
                git checkout "$rev" -- tools/ratchet tools/ratchet.d
                git -c user.name=ratchet -c user.email=ratchet@invalid -c commit.gpgsign=false \
                  commit --no-verify -m "ratchet: the base's instrument"
                echo "ratchet: checking the PR tree with $rev's instrument against the base record"
                python3 tools/ratchet --check --baseline "$RUNNER_TEMP/base-ratchets.json"
              )
            fi
          else
            echo "::notice::no base record (${rev:-no base ref}): the tree is checked against its own docs/ratchets.json alone"
          fi
          mkdir -p "$RUNNER_TEMP/ratchet"
          python3 tools/ratchet --check "${base[@]}" --out "$RUNNER_TEMP/ratchet/ratchets.json"

      # docs/NORTH-STAR.md's table is rendered from the records in the tree
      # (#77); a PR that moves a record runs tools/scoreboard --render. The
      # base's values are the base ref's tree (a git archive, never the PR's
      # own records) rendered by the BASE'S OWN tools/scoreboard, so a PR that
      # weakens the tool cannot also choose what the base says; only while the
      # base holds no tools/scoreboard (beta before #77 lands) is this tree's
      # tool used, and the log says which. The comparison itself is this
      # tree's falls(), so a PR that weakens it is a diff of tools/scoreboard
      # for its review to read. No floor, fixture, scenario or rule count may
      # fall, no allowlist may grow, no list of names may lose one and no key
      # may vanish. A base ref whose tree the tool cannot read fails the step
      # (a malformed base record is never "no base").
      - name: scoreboard
        if: ${{ !cancelled() }}
        env:
          REV: ${{ steps.base.outputs.rev }}
        run: |
          python3 -B tools/test_scoreboard.py
          python3 -B tools/test_fuzz_record.py
          python3 -B tools/test_mutants_hermetic.py
          # The bench gate's cases and the bench jobs' shape (#503), which the
          # Nightly's bench job runs before it measures.
          python3 -B tools/test_bench_compare.py
          # The Nightly's two modes (#462): the plan's changed set and the
          # score's carried figures and refusals.
          python3 -B tools/test_changed_set.py
          python3 -B tools/test_mutants_score.py
          # CI's own test selection on a PR (#473), on the same oracle.
          python3 -B tools/test_affected.py
          # The docs-only exit never skips a gate's input (#509): every
          # input planted through .github/ci/docs_only.sh --paths.
          python3 -B tools/test_docs_only.py
          # The Mutants shards' left-out targets (#401): the recorded reach
          # holds every entry of the list at zero lines of a floored file.
          python3 -B tools/test_no_floored.py
          python3 -B .github/nightly/no_floored.py check .github/nightly/no-floored-reach.json
          base=()
          if [ -n "$REV" ]; then
            mkdir -p "$RUNNER_TEMP/base-tree"
            git archive "$REV" | tar -x -C "$RUNNER_TEMP/base-tree"
            if git show "$REV:tools/scoreboard" > "$RUNNER_TEMP/base-scoreboard-tool" 2>/dev/null; then
              tool="$RUNNER_TEMP/base-scoreboard-tool"
              echo "scoreboard: the base values are $REV's tree, rendered by $REV's own tools/scoreboard"
            else
              tool=tools/scoreboard
              echo "scoreboard: the base values are $REV's tree, rendered by this tree's tools/scoreboard ($REV has none)"
            fi
            python3 -B "$tool" --root "$RUNNER_TEMP/base-tree" --json > "$RUNNER_TEMP/base-scoreboard.json"
            base=(--base "$RUNNER_TEMP/base-scoreboard.json")
          else
            echo "::notice::no base ref: the table is checked against the tree alone"
          fi
          python3 -B tools/scoreboard --check "${base[@]}"

      - name: links and citations
        if: ${{ !cancelled() }}
        run: |
          python3 -B tools/test_ratchet.py
          python3 -B tools/test_check_links.py
          python3 -B tools/check-links
          python3 -B tools/test_check_cites.py
          python3 -B tools/check-cites
          python3 -B tools/test_aggregate.py

      # The ensemble chain's dry runs (#392): tools/lanes/chain-ensemble.sh
      # and ensemble-read.sh against stub-runner.sh standing in for cca and
      # gh, no seat and no network. The log shows each case's ENSEMBLE: or
      # AGGREGATE: line; a failed case fails the job. The scripts are zsh;
      # the runner image may lack it, so the step installs it when absent
      # and says which.
      - name: ensemble chain dry runs
        if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
        run: |
          set -euo pipefail
          if command -v zsh > /dev/null; then
            echo "zsh: present on the runner ($(zsh --version))"
          else
            echo "zsh: absent on the runner, installed with apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq zsh > /dev/null
            zsh --version
          fi
          zsh -f tools/test_chain_ensemble.sh

      - name: changelog fragment
        if: ${{ !cancelled() }}
        env:
          REV: ${{ steps.base.outputs.rev }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B tools/test_changelog.py
          # A push's PR was checked; on a PR the ratchet job's base ref is
          # the PR's base branch, fetched by The base ref above.
          # A merge-queue group has no PR number in its event and may batch
          # several PRs, so no label is read: each PR's own pull_request run
          # checked its fragment and label (the queue admits a PR only with
          # its required checks green), and the group's tree is checked here
          # for a malformed fragment, which no label excuses.
          if [ "$EVENT" = merge_group ]; then
            echo "changelog: merge_group: the fragment requirement was checked on each PR; validating the group's fragments"
            python3 -B tools/changelog --list
            exit 0
          fi
          if [ "$EVENT" != pull_request ]; then
            echo "changelog: $EVENT: the fragment requirement is checked on the PR"
            exit 0
          fi
          if [ -z "$REV" ]; then
            echo "::error::the PR's base ref is empty"
            exit 1
          fi
          # Read current labels, as the differential step does: a re-run
          # reuses the event payload, so a later label must be read here.
          if ! allow=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
              --jq '[.labels[].name] | index("no-changelog") != null'); then
            echo "::error::the PR's labels could not be read (gh pr view)"
            exit 1
          fi
          echo "label no-changelog: $allow (read at run time)"
          check=(--check --base "$REV")
          if [ "$allow" = true ]; then
            check+=(--allow-missing)
          fi
          python3 -B tools/changelog "${check[@]}"

      - name: Keep the measured JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ratchets
          path: ${{ runner.temp }}/ratchet/
          if-no-files-found: warn

  build:
    name: Build (${{ matrix.os }})
    needs: changes
    # Never skipped: see lint's. Each step skips on a docs-only change (#476).
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Ubuntu alone on every event (the owner's word of 2026-10-27: a push runs
        # exactly the required set, the same as a pull request, nothing more);
        # the macOS build is build-macos.yml on workflow_dispatch; the tag's Binaries
        # job in release.yml builds the macOS targets.
        os: [ubuntu-latest]
    steps:
      - name: docs-only PR
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: 'echo "docs-only PR: Build (ubuntu-latest) skipped by #476"'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.changes.outputs.docs_only != 'true' }}

      # The fuzz check's pinned toolchain is installed before the cache step,
      # so the cache key considers it (rust-cache hashes every installed
      # toolchain); stable after it stays the default (#452).
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          toolchain: 1.98.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          toolchain: stable

      # A workspace's target is relative to its root: `fuzz -> target` is
      # fuzz/target (`fuzz -> fuzz/target` cached fuzz/fuzz/target, which
      # never exists, and the fuzz check built cold on every hit, #452).
      # The release build's one key (#472), `release`, which e2e-hermetic
      # restores: this job saves it on a push to beta or main, and only
      # here. Sharing it needs the same toolchains (they are hashed into the
      # key) and the same workspaces (the cached paths are the entry's
      # version), so e2e-hermetic installs 1.98.1 too and names fuzz/target.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          shared-key: release
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main') }}
          workspaces: |
            . -> target
            fuzz -> target

      - name: Build workspace (release)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: cargo build --release --locked

      - name: Build MCP subcrate (release)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: cargo build --release --locked -p bsv-wallet-mcp

      # The fuzz crate (fuzz/, its own workspace and lock) is built by no
      # other job but the Nightly, so a pin or an API move broke two targets
      # silently until the night lost their hour (#301). Every target, its
      # lib and its seed example are checked against the committed lock on
      # the pinned toolchain (installed above); libfuzzer-sys checks on
      # stable, so no nightly and no cargo-fuzz here.
      - name: Check the fuzz crate (every target)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: cargo check --manifest-path fuzz/Cargo.toml --locked --all-targets

  test:
    name: Test
    needs: changes
    # Never skipped: see lint's. Each step skips on a docs-only change (#476).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: docs-only PR
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: 'echo "docs-only PR: Test skipped by #476"'

      # The selection (#473): on a PR the test targets its diff reaches
      # (.github/ci/affected.py, the Nightly's oracle), on a merge-queue
      # group, a push and a tag the whole suite. A PR's green is the reached
      # tests', the queue's the suite's (docs/lanes/README.md rule 18).
      - name: The selection
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        env:
          SELECTION: "${{ needs.changes.outputs.selection || 'selection: all (the whole suite; no selection read)' }}"
          TEST_RUN: ${{ needs.changes.outputs.test_run }}
        run: |
          echo "$SELECTION"
          if [ "$TEST_RUN" = false ]; then echo "no test target reached: Test skipped by #473"; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.test_run != 'false' }}

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.test_run != 'false' }}
        with:
          toolchain: stable

      # The test build's one key (#472), `test`, shared with wire and
      # vectors, which restore it and never save it. This job builds the
      # superset (every test target of the workspace) and saves the key on a
      # push to beta or main alone: a PR reads its base branch's entry, a
      # merge-queue group reads the default branch's (main), where
      # cache-beta.yml saves this key from beta's tree (#486), and an entry
      # saved under a PR's or a group's ref was never read again (5.6 of the
      # cache's 10.4 GB on 2026-11-03 was the queue's dead refs). The three
      # build with --workspace: the root package alone unifies other
      # features (serde_json, syn) and would rebuild what the key holds.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.test_run != 'false' }}
        with:
          shared-key: test
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main') }}

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.test_run != 'false' }}
        with:
          tool: cargo-nextest@0.9.150

      # The compile, its own step so its time is its own line in the run.
      - name: Build the workspace's tests
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.test_run != 'false' }}
        env:
          TEST_ARGS: ${{ needs.changes.outputs.test_args || '--workspace' }}
        run: |
          read -ra args <<< "$TEST_ARGS"
          cargo test "${args[@]}" --locked --no-run

      # nextest runs exactly what cargo test would (#472): the multiset of
      # test names nextest lists, ignored ones included, equals the one
      # libtest lists for the same build. nextest runs no doctest, so a
      # doctest shows here as cargo's alone and fails the step until a
      # `cargo test --doc` step stands beside the run. The linker is
      # printed, not chosen: stable has linked with rust-lld on x86_64
      # Linux since 1.90, and lld names itself in the binary's .comment.
      - name: "nextest's list is cargo test's"
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.test_run != 'false' }}
        env:
          TEST_ARGS: ${{ needs.changes.outputs.test_args || '--workspace' }}
        run: |
          set -euo pipefail
          read -ra args <<< "$TEST_ARGS"
          list="$RUNNER_TEMP/lists"
          mkdir -p "$list"
          cargo nextest list "${args[@]}" --locked --run-ignored all --message-format oneline --color never > "$list/nextest.txt"
          cargo test "${args[@]}" --locked --color never -- --list > "$list/cargo.txt"
          cut -d' ' -f2- "$list/nextest.txt" | sort > "$list/nextest.names"
          sed -n 's/: test$//p' "$list/cargo.txt" | sort > "$list/cargo.names"
          n=$(wc -l < "$list/nextest.names" | tr -d ' ')
          c=$(wc -l < "$list/cargo.names" | tr -d ' ')
          echo "nextest list: $n tests; cargo test -- --list: $c tests"
          if ! diff -u "$list/cargo.names" "$list/nextest.names"; then
            echo "::error::nextest lists $n tests and cargo test $c; the diff above names each (a doctest needs cargo test --doc beside nextest)"
            exit 1
          fi
          [ "$n" -gt 0 ] || { echo "::error::no test listed"; exit 1; }
          rustc -vV
          # A selection without the unit tests builds no bsv_wallet_cli-*
          # binary (#473): the newest test binary of the selection then.
          bin=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'bsv_wallet_cli-*' | head -n 1)
          [ -n "$bin" ] || bin=$(find target/debug/deps -maxdepth 1 -type f -executable -name '*-*' -newer Cargo.lock | head -n 1)
          if [ -n "$bin" ]; then
            echo "the linker of $bin:"
            readelf -p .comment "$bin" | sed -n 's/^ *\[ *[0-9a-f]*\] *//p'
          else
            echo "no test binary found to name the linker"
          fi

      # Every target of the workspace off a PR, not the synthetic integration
      # tests alone: the unit tests and the witnesses of the 0.3.x and 0.4.0
      # fixes (the callback intake, the tracker-off refusals) live in the
      # others. On a PR, the targets the selection names (#473).
      # nextest runs each test in its own process, every binary at once
      # (#472): libtest ran the binaries one after another, and the wire
      # binary's tests one at a time behind its in-process lock (the audit
      # log is the process's), about 300 of the job's 450 seconds.
      - name: Run the workspace's tests
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.test_run != 'false' }}
        env:
          TEST_ARGS: ${{ needs.changes.outputs.test_args || '--workspace' }}
        run: |
          read -ra args <<< "$TEST_ARGS"
          cargo nextest run "${args[@]}" --locked --no-fail-fast

  # The vector-backed tests as one named check: the Arcade status vector
  # (tests/vectors/arcade_status_verdicts.json, the toolbox's file) through the
  # webhook intake, the gift covenant's sCrypt parity vectors
  # (src/gift/covenant_vectors.json), and the stack's wallet-gate vectors
  # (tests/vectors/wallet_gate_vectors.json at the pin beside it, #130).
  vectors:
    name: vectors
    needs: changes
    # Never skipped: see lint's. Each step skips on a docs-only change (#476).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: docs-only PR
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: 'echo "docs-only PR: vectors skipped by #476"'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.changes.outputs.docs_only != 'true' }}

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          toolchain: stable

      # Test's key, restored and never saved (#472); --workspace as Test's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          shared-key: test
          save-if: false

      - name: The vector files are present
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          test -s tests/vectors/arcade_status_verdicts.json
          test -s src/gift/covenant_vectors.json
          test -s tests/vectors/wallet_gate_vectors.json
          test -s tests/vectors/wallet_gate_vectors.pin

      - name: Run the Arcade status vector through the webhook intake
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: cargo test --workspace --locked --test arcade_webhook_vector_tests

      # A filter that matches nothing passes; the grep refuses a renamed module.
      - name: Run the covenant vectors
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          set -o pipefail
          cargo test --workspace --locked --lib gift::covenant::tests:: | tee covenant.log
          grep -q 'test result: ok. 5 passed' covenant.log

      # Every row of the stack's wallet-gate vectors replayed against the gate
      # (docs/GATE-VECTORS.md): the copy checked against its pin, the
      # unexpressed rows and the recorded divergences exact.
      - name: Replay the wallet-gate vectors against the gate
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          set -o pipefail
          cargo test --workspace --locked --test gate_vectors -- --nocapture | tee gate_vectors.log
          grep -q '^gate vectors: 490 rows' gate_vectors.log
          grep -q 'test result: ok. 3 passed' gate_vectors.log

  # The wire oracle (#69): every served call and refusal body under
  # tests/wire/, replayed against the router in-process. A PR that changes a
  # response byte fails here unless it changes the fixture too (docs/WIRE.md).
  wire:
    name: wire
    needs: changes
    # Never skipped: see lint's. Each step skips on a docs-only change (#476).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: docs-only PR
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: 'echo "docs-only PR: wire skipped by #476"'

      # The selection (#473): the replay runs when the diff reaches the wire
      # target, and always off a PR; see Test's.
      - name: The selection
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        env:
          SELECTION: "${{ needs.changes.outputs.selection || 'selection: all (the whole suite; no selection read)' }}"
          WIRE: ${{ needs.changes.outputs.wire }}
        run: |
          echo "$SELECTION"
          if [ "$WIRE" = false ]; then echo "the wire target is not reached: wire skipped by #473"; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.wire != 'false' }}

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.wire != 'false' }}
        with:
          toolchain: stable

      # Test's key, restored and never saved (#472): the dependencies come
      # from Test's build on beta, and this job compiles the workspace's own
      # crates alone. Taking the PR's own Test build instead (an artifact)
      # would start the replay only after Test's compile and upload ended:
      # Test's compile was 56 seconds and this job's own warm compile 31 in
      # run 41570593531, so waiting would cost more than it saves.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.wire != 'false' }}
        with:
          shared-key: test
          save-if: false

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.wire != 'false' }}
        with:
          tool: cargo-nextest@0.9.150

      - name: The fixtures and their manifest are present
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.wire != 'false' }}
        run: ls tests/wire/*.json > /dev/null && test -f tests/wire/MANIFEST.json

      # Replay only. A recording never passes (the test fails with the word
      # to replay it), and this job refuses to start one: WIRE_RECORD set to
      # anything fails here before cargo runs.
      - name: WIRE_RECORD is not set
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.wire != 'false' }}
        run: |
          if [ -n "${WIRE_RECORD+set}" ]; then
            echo "WIRE_RECORD is set (${WIRE_RECORD}); the wire job replays, never records"
            exit 1
          fi

      - name: Build the wire binary
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.wire != 'false' }}
        run: cargo test --workspace --locked --no-run --test wire

      # Each test in its own process (#472), so the harness's lock, which
      # serializes the worlds within a process (the permission audit is the
      # process's), no longer serializes the binary: about 300 seconds under
      # libtest, one test at a time.
      - name: Replay the wire fixtures
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.wire != 'false' }}
        run: cargo nextest run --workspace --locked --no-fail-fast --test wire

      - name: No fixture was written by the run
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.wire != 'false' }}
        run: git diff --exit-code -- tests/wire && test -z "$(git status --porcelain -- tests/wire)"


  # The hermetic e2e suite (#74, docs/E2E-HERMETIC.md): the 30 scenarios of
  # tests/e2e against a local stub of the header service, the three explorers
  # and the broadcaster (tests/e2e/stub), with the proxy environment walling
  # every other host: every request from the binary and the harness becomes a
  # CONNECT the stub refuses and counts (Node 24 with NODE_USE_ENV_PROXY=1 for
  # the harness's own fetch; Chromium by its launch args). The wall binds the
  # clients that honour it; the runner's egress is not blocked at the OS
  # (docs/E2E-HERMETIC.md, "The wall"). No sat moves; a walled attempt at a
  # host other than the declared explorer and discovery hosts, an unserved stub
  # route or unread stats fails the run. The mainnet run stays the release
  # gate. On failure the kept wallet directories (keys and serve.log), the
  # stub's log and the run's log are uploaded.
  e2e-hermetic:
    name: e2e-hermetic
    needs: changes
    # Never skipped: see lint's. Each step skips on a docs-only change (#476).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The runner context is not available in a job's env; the wallets' tmp
    # directory is set on the step that runs the harness.
    env:
      NODE_USE_ENV_PROXY: '1'
    steps:
      - name: docs-only PR
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: 'echo "docs-only PR: e2e-hermetic skipped by #476"'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.changes.outputs.docs_only != 'true' }}

      # Build's key, `release`, restored and never saved (#472): the same
      # toolchains in the same order (1.98.1 is installed for the key alone;
      # stable stays the default) and the same workspaces as Build's.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          toolchain: 1.98.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          shared-key: release
          save-if: false
          workspaces: |
            . -> target
            fuzz -> target

      - name: Build the release binaries the harness drives
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          cargo build --release --locked
          cargo build --release --locked -p bsv-wallet-mcp

      # Node 24: its fetch and http obey the proxy environment under
      # NODE_USE_ENV_PROXY=1 (Node 20 ignores it).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          node-version: '24'

      # Scenario 20 drives the inspector UI through Playwright's Chromium;
      # the browser is cached by the lock file, its system libraries are not.
      - name: Install the harness's dependency (Playwright)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: tests/e2e
        run: npm ci

      # Restored on every run, saved by a push to beta or main alone, as the
      # rust-cache keys (#472): a group's ref saved its own copy that no run
      # read again (#486).
      - name: Cache Playwright's Chromium
        id: playwright
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cca/pw-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Chromium
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: node tests/e2e/install-browsers.js --with-deps

      - name: Save Playwright's Chromium
        if: ${{ needs.changes.outputs.docs_only != 'true' && steps.playwright.outputs.cache-hit != 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main') }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cca/pw-browsers
          key: ${{ steps.playwright.outputs.cache-primary-key }}

      - name: Check the hermetic BEEF codecs and kept-template demand
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: node --test tests/e2e/stub/tx.test.js tests/e2e/24-busy-store.test.js

      - name: Run the 30 scenarios against the stub
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        env:
          E2E_WALLET_TMP: ${{ runner.temp }}/e2e
        run: |
          set -o pipefail
          mkdir -p "$E2E_WALLET_TMP"
          node --version
          E2E_HERMETIC=1 node tests/e2e/run.js 2>&1 | tee "$E2E_WALLET_TMP/run.log"

      - name: Keep the wallets, the stub's log and the run's log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-hermetic-kept
          path: ${{ runner.temp }}/e2e/
          if-no-files-found: ignore
