[package]
name = "bsv-wallet-cli-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Its own workspace: the root `Cargo.toml` and its lock are untouched; this
# crate keeps its own `Cargo.lock` beside this manifest.
[workspace]
members = ["."]

[lib]
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
bsv-wallet-cli = { path = ".." }
# The names the CLI's own files use, so `src/atomic_beef.rs` and
# `src/brc29.rs` (binary-only modules) compile here unchanged by `#[path]`.
bsv-sdk = { package = "bsv-rs", version = "=0.8.1", features = ["full"] }
bsv-wallet-toolbox = { package = "bsv-wallet-toolbox-rs", version = "=0.12.1", features = ["sqlite"] }
anyhow = "1"
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }

[[bin]]
name = "beef_reader"
path = "fuzz_targets/beef_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "brc29_remittance"
path = "fuzz_targets/brc29_remittance.rs"
test = false
doc = false
bench = false

[[bin]]
name = "served_json"
path = "fuzz_targets/served_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "explorer_bodies"
path = "fuzz_targets/explorer_bodies.rs"
test = false
doc = false
bench = false

[[bin]]
name = "allow_pending"
path = "fuzz_targets/allow_pending.rs"
test = false
doc = false
bench = false

# Writes the seed corpus under `corpus/<target>/` (see docs/NIGHTLY.md).
# An example, not a bin: `cargo fuzz build` links every bin against
# libFuzzer's `main`.
[[example]]
name = "seed_corpus"
path = "examples/seed_corpus.rs"
