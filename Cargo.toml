[workspace]
members = [".", "mcp"]
resolver = "2"

[package]
name = "bsv-wallet-cli"
version = "0.19.0-beta.6"
edition = "2021"
license = "MIT"
authors = ["John Calhoun"]
description = "Self-hosted BSV wallet CLI and BRC-100 server, wire-compatible with MetaNet Client"
repository = "https://github.com/Calhooon/bsv-wallet-cli"
homepage = "https://github.com/Calhooon/bsv-wallet-cli"
keywords = ["bsv", "bitcoin", "wallet", "brc-100"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[lib]
name = "bsv_wallet_cli"
path = "src/lib.rs"

[[bin]]
name = "bsv-wallet"
path = "src/main.rs"

# Companion binary: ONE public ARC/Arcade callback receiver, store-and-forward
# by callback token — wallet daemons poll /pull outbound and drain their queue.
[[bin]]
name = "bsv-wallet-relay"
path = "src/bin/bsv-wallet-relay.rs"

[dependencies]
bsv-wallet-toolbox = { package = "bsv-wallet-toolbox-rs", version = "=0.14.0-beta.6", features = ["sqlite"] }
bsv-sdk = { package = "bsv-rs", version = "=0.9.0-beta.6", features = ["full"] }
bsv-tracker = "=0.9.0-beta.6"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
hex = "0.4"
url = "2"
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
reqwest = { version = "0.12", features = ["json"] }

[features]
default = []
tls = ["axum-server"]

[dev-dependencies]
# tests/fuzz_replay.rs compiles fuzz/src/lib.rs (the fuzz targets'
# properties) by `#[path]` (#396): `arbitrary` decodes brc29_remittance's
# seeds as the fuzz binary does, pinned to fuzz/Cargo.lock's version so a
# seed decodes to the same input on both sides; `encoding_rs` is
# explorer_bodies' reading of a body as `reqwest`'s `text()` does.
arbitrary = { version = "=1.5.0", features = ["derive"] }
encoding_rs = "0.8"
async-trait = "0.1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# The hot path's benches (#71): p50 and p99 per bench, compared to
# benches/baseline.json by tools/bench-compare.
[[bench]]
name = "gate_assess"
harness = false

[[bench]]
name = "create_action_signed"
harness = false

[[bench]]
name = "internalize_action"
harness = false

[[bench]]
name = "list_outputs"
harness = false

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
